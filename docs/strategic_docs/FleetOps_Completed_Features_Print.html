    <script type="text/markdown" id="markdown-source"># قائمة الميزات المنجزة (Features List)

توضح هذه القائمة مخرجات النظام البرمجية التي تم الانتهاء من تطويرها وفحصها ومطابقتها برمجياً مع المتطلبات المحددة بالاتفاق الأصلي:

---

## MOD-01: إدارة العمليات (Operations)

### أ) إدخال الطلبات وتسجيل العمل اليومي
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| OP-001 | السجل اليومي للطلبات | إدخال يومي يشمل: اسم السائق + العقد + عدد الطلبات + الكاش المحصّل | منجز ✅ | مطبق بالخلفية والواجهة |
| OP-002 | إدخال بأثر رجعي | إمكانية إدخال بيانات أيام سابقة مع تنبيهات أمان مرنة | منجز ✅ | يدعم تدوين الأيام السابقة لتفادي فجوات التأخير |
| OP-003 | ربط الطلب بالعقد | ربط السجل اليومي للطلبات بالعقود المربوط بها السائق | منجز ✅ | يدعم احتساب الدخل والراتب بدقة عند انتقال السائق |
| OP-004 | التحقق والفرز المالي | مقارنة المدخلات لتتبع إجمالي الطلبات اليومية والكاش المصاحب | منجز ✅ | لوحة عمليات مركزية لمدير العمليات |

### ب) إدارة الكاش والعهدة
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| OP-005 | تتبع الكاش المعلق | حساب المبالغ النقدية المعلقة في ذمة كل سائق وتحديثها لحظياً | منجز ✅ | يعرض إجمالي المبالغ المعلقة لتفادي مخاطر الكاش |
| OP-006 | تفاصيل الكاش المعلق | تفصيل الكاش لكل سائق: العقود المنجزة، والتواريخ، والسيارة المعنية | منجز ✅ | يتيح للمشرف اتخاذ قرار تسوية سريع |
| OP-007 | تسوية الكاش (إبراء الذمة) | تسجيل تسليم النقد + تصوير إيصال التسليم إجبارياً لمنع التلاعب | منجز ✅ | يمنع تسوية مبالغ أكبر من الكاش المعلق لتأمين الخزنة |
| OP-008 | لوحة تحكم الكاش | شاشة عرض مركزية تلخص إجمالي الكاش المعلق ومجموع التسويات | منجز ✅ | مدمجة في الواجهة الرئيسية للإدارة |
| OP-008B | قسم العهد المتكامل | تتبع العهد العينية والمادية: أصول، ملابس، هواتف، شرائح، عهد كاش | منجز ✅ | تتبع حالات العهدة: مسلّمة، مستلمة، ومرتجعة |
| OP-008C | ضمانات السائقين | حفظ وتتبع جوازات السفر والمستندات الضامنة الخاصة بالسائقين | منجز ✅ | متصل ببروفايل الموظف وقسم الموارد البشرية |

### ج) المخالفات المرورية
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| OP-009 | تسجيل المخالفات بالصورة | إدخال المخالفة + صورة إجبارية + القيمة والتاريخ وبيانات السيارة | منجز ✅ | إمكانية الرفع الحقيقي للصور وحفظها بسيرفر المستندات |
| OP-009B | إرسال المخالفة واتساب | إرسال إشعار فوري وتفصيلي للسائق عبر الواتساب لإبلاغه بالمخالفة | منجز ✅ | تكامل مع WhatsApp API لتحديث السائقين آلياً |
| OP-010 | إثبات المخالفة للسائق | مرجع إثبات مسجل يحتوي على الصور والتفاصيل يطمئن إليه الموظف | منجز ✅ | يعرض سجل المخالفات التاريخي في ملف السائق |
| OP-011 | خصم المخالفات تلقائياً | ربط المخالفة المعتمدة بمسير الرواتب لخصمها تلقائياً عند الصرف | منجز ✅ | يتم ترحيلها إلى كشوف الرواتب الشهرية والـ Ledger |
| OP-012 | الإبلاغ عن حادث | رفع بلاغ حادث تشغيلي مع الصور المتعددة وتفاصيل الحادث | منجز ✅ | بلاغ مباشر من الأوبريشن يغير حالة السيارة تلقائياً |
| OP-013 | تحويل السيارة للصيانة | تحويل السيارة المتضررة اختيارياً لقسم الصيانة والورش | منجز ✅ | يقوم النظام بإنشاء طلب صيانة وربطه بالمركبة المحددة |

---

## MOD-02: إدارة الصيانة (Maintenance)

| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| MN-001 | استلام طلب صيانة | استلام تلقائي لطلب الصيانة من الأوبريشن أو إنشاؤه يدوياً | منجز ✅ | يربط الحادث أو العطل بالمركبة مباشرة |
| MN-002 | التوجيه للكراج | تتبع نقل السيارة لورشة الإصلاح وتصوير حالتها الفنية | منجز ✅ | يسجل تواريخ الدخول والخروج المتوقعة لتفادي التعطيل |
| MN-003 | رفع فاتورة/عرض سعر | رفع فاتورة الكراج، القيمة المادية، وربطها بالطلب تشغيلياً | منجز ✅ | يدعم رفع الصور والمستندات المالية والتحقق منها |
| MN-004 | موافقة السوبرفايزر | مراجعة السوبرفايزر واعتماده للفاتورة لمنع تضخيم الأسعار | منجز ✅ | حجر زاوية لمنع التلاعب المالي بورش الإصلاح |
| MN-005 | طلب عرض بديل | رفض العرض والمطالبة بعرض بديل من كراج آخر عند الرفض | منجز ✅ | تغيير حالة الطلب وإعادته للفني للبحث عن سعر أفضل |
| MN-006 | تحويل للمحاسبين | إحالة الفاتورة المعتمدة لقسم المحاسبة لإصدار الدفعات المالية | منجز ✅ | متصل تلقائياً بقسم المالية ومصروفات المركبة |
| MN-007 | تحميل على السائق | تحميل قيمة الصيانة (كلياً أو جزئياً) كخصم على السائق المتسبب | منجز ✅ | يخصم من رصيد السائق مدين/دائن ويدخل بمسير الرواتب |
| MN-008 | تتبع حالة الصيانة | تتبع مراحل دورة حياة الصيانة (جديد، معتمد، قيد الإصلاح، مكتمل) | منجز ✅ | تحديث ديناميكي لحالات الصيانة وحالة توافر السيارات |

---

## MOD-03: إدارة الأسطول (Fleet Management)

### أ) لوحة تحكم وحالات المركبة
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| FL-001 | تسجيل المركبات | إضافة وتحديث كافة بيانات المركبة (اللوحة، الموديل، المالك، الشاسيه) | منجز ✅ | يدعم تحديد نوع ملكية السيارة (شراء، إيجار، أقساط) |
| FL-002 | حالات المركبة | تتبع 4 حالات رئيسية للمركبة (متاحة، تعمل، بالصيانة، واقفة) | منجز ✅ | يعطي رؤية دقيقة لتوزيع المركبات تشغيلياً |
| FL-003 | لوحة تحكم الأسطول | ملخص بياني يوضح أعداد السيارات الفعالة وتحليلات توفرها | منجز ✅ | شاشة تفاعلية بالكامل تدعم الفلترة السريعة |
| FL-004 | ربط مركبة بسائق | إسناد السائق للسيارة مع تتبع السجل التاريخي الكامل لعهدة المركبة | منجز ✅ | يسمح بتغيير السائقين مع تسجيل الفترات وتفادي كراش الحسابات |
| FL-005 | ربط مركبة بعقد | إسناد السيارات لعقود التشغيل والشركات مع حفظ لوجر تاريخي | منجز ✅ | يدعم انتقال السيارة بين عقود متعددة شهرياً |

### ب) وثائق ومصاريف المركبة
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| FL-006 | وثائق المركبة (ديناميك) | إدارة وثائق السيارة المرنة (تأمين، رخص الغذاء، تراخيص البلدية) | منجز ✅ | يدعم رفع ملفات الوثائق وتحديث تواريخ انتهائها ديناميكياً |
| FL-007 | تنبيهات وثائق المركبة | إطلاق إشعارات تنبيه قبل انتهاء صلاحية الأوراق بـ 30 أو 60 يوماً | منجز ✅ | إشعار لوني ذكي (أحمر، أصفر، أخضر) لتجنب الغرامات |
| FL-008 | بدل بنزين ثابت | تدوين وإدارة مبالغ البنزين الثابتة المصروفة للسائقين | منجز ✅ | تم التمسك بمبدأ البدل الثابت وإلغاء الميزانية المفتوحة |
| FL-010 | تسجيل تعبئة البنزين | إدخال قيمة التعبئة مع صورة الفاتورة وإلزامية إرفاق صورة العداد | منجز ✅ | يتحقق من أن عداد النهاية أكبر من البداية لضمان الاستهلاك |
| FL-011 | سجل Odometer | تدوين قراءات عدادات المسافة للمركبات بشكل دوري | منجز ✅ | يدعم الإدخال اليدوي والتنبؤ التلقائي لموعد الصيانة |
| FL-012 | تنبيه غيار الزيت | تنبيه أحمر بالمنصة عند قطع مسافة 4000 كم منذ آخر غيار زيت | منجز ✅ | يعتمد على قراءات العداد الفعلية وليس الزمن لقوة الاستخدام |
| FL-013 | تنبيهات الصيانة الوقائية | تنبيه مجدول قبل أسبوع من موعد الصيانة الدورية المعتمد | منجز ✅ | يحسب معدل القيادة اليومي ويتنبأ بالانتهاء |

---

## MOD-04: الموارد البشرية والرواتب (HR & Payroll)

### أ) شؤون الموظفين والتوظيف
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| HR-001 | تسجيل الموظف الجديد | إضافة ملف الموظف ورقم الهاتف، مع توليد رقم وظيفي آلي (EMP-XXXX) | منجز ✅ | رقم الهاتف إلزامي وقواعد التحقق معزولة لكل شركة |
| HR-002 | نوع انضمام الموظف | تحديد مسار التوظيف: استقدام خارجي (Overseas) أو تحويل محلي | منجز ✅ | يحدد التنبيهات وخطوات التفعيل وسرعة المعالجة |
| HR-003 | مراحل توظيف الاستقدام | تتبع الـ 4 مراحل (وصول، تسكين، فحص طبي، إذن عمل، رخصة قيادة) | منجز ✅ | تتبع كامل لرحلة الاستقدام في غضون شهرين |
| HR-004 | مرونة ترتيب المراحل | السماح بتجاوز أو تسريع ترتيب مراحل التوظيف عند الحاجة | منجز ✅ | مرونة كاملة لتخطي خطوات معينة بصلاحية المدير |
| HR-005 | تنبيه الفحص الطبي | تنبيهات مشددة للفحوصات الطبية للاستقدام لتفادي الغرامات الباهظة | منجز ✅ | أولوية قصوى لتجنب غرامات وزارة الشؤون بالكويت |
| HR-006 | فترة التجربة | تتبع فترة الاختبار (3 أشهر) وتنبيه الإدارة عند نهايتها أو الاستغناء | منجز ✅ | يغير الحالة آلياً عند انتهاء الفترة أو الإخراج |
| HR-007 | أرشيف وثائق الموظف | إدارة ديناميكية لوثائق السائق (إقامة، رخصة قيادة، بطاقة مدنية) | منجز ✅ | رفع الملفات ممسوحة ضوئياً وتتبع تواريخ انتهائها |
| HR-008 | تنبيهات وثائق الموظف | إطلاق إشعارات لانتهاء الهويات الشخصية وتراخيص القيادة | منجز ✅ | إشعار مسبق قبل 30 أو 60 يوماً |
| HR-009 | حالات الموظف | 4 حالات للموظف (فعّال، غير فعّال، إجازة، تسوية موظف) | منجز ✅ | الإجازة معزولة تشغيلياً لتفادي تجميد السائقين |
| HR-010 | أسباب تغيير الحالة | إجبار الأوبريتر على تدوين سبب تغيير حالة الموظف وحفظه تاريخياً | منجز ✅ | يدعم تقارير تحليل أسباب الاستقالات والفصل |
| HR-010B | تقييم الأداء الموظفين | تقييم الموظفين بمدخلات تفاعلية مرنة وحساب النسب الإجمالية | منجز ✅ | قسم تقييم أداء متكامل ومربوط ببروفايل السائق |
| HR-010C | إدارة وتسجيل الإجازات | تسجيل فترات إجازات السائقين (سنوية، مرضية، طارئة) وتتبع تأثيرها على العمليات والرواتب | منجز ✅ | نظام إجازات متكامل يضمن إيقاف احتساب يوميات التشغيل تلقائياً خلال الإجازة |

### ب) الحسابات والرواتب وكشف الصرف
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| HR-011 | الراتب الأساسي (رسمي) | الراتب الموثق بإذن العمل والموجه للتحويل عبر البنك للشؤون القانونية | منجز ✅ | يضمن السلامة القانونية للشركة وتجنب مطالبات نهاية الخدمة |
| HR-012 | الراتب الفعلي (داخلي) | الراتب الحقيقي (الأساسي + بونص + عمولات - خصومات) كاش | منجز ✅ | كشف الصرف الداخلي الفعلي للمدير والمحاسب |
| HR-014 | نوع دفع السائق | 3 أنواع مرنة لاحتساب مستحقات السائق: ثابت، بالطلب، أو هجين | منجز ✅ | يتم حفظ وتحديث الحساب بشكل سليم بقاعدة البيانات |
| HR-015 | نهاية الخدمة (Tick Box) | تحديد مدى استحقاق السائق لمكافأة نهاية الخدمة عند التعاقد | منجز ✅ | اتفاق مالي مسبق: راتب أعلى بدون نهاية خدمة أو العكس |
| HR-016 | حساب مكافأة نهاية الخدمة | احتساب مستحقات نهاية الخدمة للموظفين بناءً على راتب البنك الرسمي | منجز ✅ | معادلات آلية تعتمد على قوانين العمل والراتب الأساسي |
| HR-017 | كشف رواتب البنك الرسمي | تصدير كشف بأسماء ورواتب الموظفين الأساسية الموجهة للتحويل البنكي | منجز ✅ | تصدير فوري لملف البنك المعتمد لتسليمه للوزارة |
| HR-018 | كشف الرواتب الفعلي (داخلي) | احتساب كافة العمولات، المخالفات، السلف، والخصومات للرواتب | منجز ✅ | كشف حساب رواتب تفصيلي بالصافي الكاش المتبقي للسائق |

### ج) صلاحيات المستخدمين (MOD-09)
- **صاحب العمل (Owner)**: رؤية كاملة وتحكم تام، إنشاء وقفل العقود، التقارير المالية والرواتب، إدارة مستخدمين. (منجز ✅)
- **مدير العمليات (Operations Manager)**: إدخال ومتابعة العمليات اليومية، إدارة المركبات والموظفين، التقارير التشغيلية. (منجز ✅)
- **المحاسب (Accountant)**: احتساب وتصدير كشوف الرواتب والعهد وتفاصيل الكاش (قراءة الحقول المالية دون إمكانية التعديل اليدوي المباشر). (منجز ✅)
- **سوبرفايزر صيانة (Maintenance Supervisor)**: فحص عروض الأسعار واعتماد فواتير الورش أو رفضها. (منجز ✅)
- **فني صيانة (Maintenance Technician)**: تحديث حالة المركبة، رفع عروض الكراج وصور الفواتير. (منجز ✅)
- **سجل التدقيق (Audit Log)**: تسجيل ومراقبة حركات النظام المالية والحساسة (من + متى + ماذا + القيمة القديمة والجديدة) بشكل غير قابل للحذف. (منجز ✅)

## ⏸️ البنود والميزات المؤجلة (Deferred Scopes - Phase 2)
بالاتفاق الموثق بين الطرفين، تم تأجيل وتجميد الميزات والاتصالات التالية ليتم تنفيذها في مرحلة ثانية أو عبر تعاقدات ترقية منفصلة:
1. **ربط API مباشر مع أجهزة الـ GPS**: تم الاكتفاء بنظام الإدخال اليدوي لقراءة العداد تشغيلياً لتحديث غيار الزيت والصيانة.
2. **تكامل دفتر الأستاذ العام والشجرة المحاسبية (General Ledger & Chart of Accounts)**: تأجيل الربط المالي المباشر والترحيل المحاسبي لقيود اليومية لدفتر الأستاذ العام والشجرة المحاسبية حتى يتم اعتماد وتثبيت مسيرات الرواتب النهائية في النظام.
