# قائمة الميزات المنجزة (Features List)

توضح هذه القائمة مخرجات النظام البرمجية التي تم الانتهاء من تطويرها وفحصها ومطابقتها برمجياً مع المتطلبات المحددة بالاتفاق الأصلي:

---

## MOD-01: إدارة العمليات (Operations)

### أ) إدخال الطلبات وتسجيل العمل اليومي
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| OP-001 | السجل اليومي للطلبات | إدخال يومي يشمل: اسم السائق + العقد + عدد الطلبات + الكاش المحصّل | منجز ✅ | مطبق بالخلفية والواجهة |
| OP-002 | إدخال بأثر رجعي | إمكانية إدخال بيانات أيام سابقة مع تنبيهات أمان مرنة | منجز ✅ | يدعم تدوين الأيام السابقة لتفادي فجوات التأخير |
| OP-003 | ربط الطلب بالعقد | ربط السجل اليومي للطلبات بالعقود المربوط بها السائق | منجز ✅ | يدعم احتساب الدخل والراتب بدقة عند انتقال السائق |
| OP-004 | التحقق والفرز المالي | مقارنة المدخلات لتتبع إجمالي الطلبات اليومية والكاش المصاحب | منجز ✅ | لوحة عمليات مركزية لمدير العمليات |

### ب) إدارة الكاش والعهدة
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| OP-005 | تتبع الكاش المعلق | حساب المبالغ النقدية المعلقة في ذمة كل سائق وتحديثها لحظياً | منجز ✅ | يعرض إجمالي المبالغ المعلقة لتفادي مخاطر الكاش |
| OP-006 | تفاصيل الكاش المعلق | تفصيل الكاش لكل سائق: العقود المنجزة، والتواريخ، والسيارة المعنية | منجز ✅ | يتيح للمشرف اتخاذ قرار تسوية سريع |
| OP-007 | تسوية الكاش (إبراء الذمة) | تسجيل تسليم النقد + تصوير إيصال التسليم إجبارياً لمنع التلاعب | منجز ✅ | يمنع تسوية مبالغ أكبر من الكاش المعلق لتأمين الخزنة |
| OP-008 | لوحة تحكم الكاش | شاشة عرض مركزية تلخص إجمالي الكاش المعلق ومجموع التسويات | منجز ✅ | مدمجة في الواجهة الرئيسية للإدارة |
| OP-008B | قسم العهد المتكامل | تتبع العهد العينية والمادية: أصول، ملابس، هواتف، شرائح، عهد كاش | منجز ✅ | تتبع حالات العهدة: مسلّمة، مستلمة، ومرتجعة |
| OP-008C | ضمانات السائقين | حفظ وتتبع جوازات السفر والمستندات الضامنة الخاصة بالسائقين | منجز ✅ | متصل ببروفايل الموظف وقسم الموارد البشرية |

### ج) المخالفات المرورية
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| OP-009 | تسجيل المخالفات بالصورة | إدخال المخالفة + صورة إجبارية + القيمة والتاريخ وبيانات السيارة | منجز ✅ | إمكانية الرفع الحقيقي للصور وحفظها بسيرفر المستندات |
| OP-009B | إرسال المخالفة واتساب | إرسال إشعار فوري وتفصيلي للسائق عبر الواتساب لإبلاغه بالمخالفة | منجز ✅ | تكامل مع WhatsApp API لتحديث السائقين آلياً |
| OP-010 | إثبات المخالفة للسائق | مرجع إثبات مسجل يحتوي على الصور والتفاصيل يطمئن إليه الموظف | منجز ✅ | يعرض سجل المخالفات التاريخي في ملف السائق |
| OP-011 | خصم المخالفات تلقائياً | ربط المخالفة المعتمدة بمسير الرواتب لخصمها تلقائياً عند الصرف | منجز ✅ | يتم ترحيلها إلى كشوف الرواتب الشهرية والـ Ledger |
| OP-012 | الإبلاغ عن حادث | رفع بلاغ حادث تشغيلي مع الصور المتعددة وتفاصيل الحادث | منجز ✅ | بلاغ مباشر من الأوبريشن يغير حالة السيارة تلقائياً |
| OP-013 | تحويل السيارة للصيانة | تحويل السيارة المتضررة اختيارياً لقسم الصيانة والورش | منجز ✅ | يقوم النظام بإنشاء طلب صيانة وربطه بالمركبة المحددة |

---

## MOD-02: إدارة الصيانة (Maintenance)

| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| MN-001 | استلام طلب صيانة | استلام تلقائي لطلب الصيانة من الأوبريشن أو إنشاؤه يدوياً | منجز ✅ | يربط الحادث أو العطل بالمركبة مباشرة |
| MN-002 | التوجيه للكراج | تتبع نقل السيارة لورشة الإصلاح وتصوير حالتها الفنية | منجز ✅ | يسجل تواريخ الدخول والخروج المتوقعة لتفادي التعطيل |
| MN-003 | رفع فاتورة/عرض سعر | رفع فاتورة الكراج، القيمة المادية، وربطها بالطلب تشغيلياً | منجز ✅ | يدعم رفع الصور والمستندات المالية والتحقق منها |
| MN-004 | موافقة السوبرفايزر | مراجعة السوبرفايزر واعتماده للفاتورة لمنع تضخيم الأسعار | منجز ✅ | حجر زاوية لمنع التلاعب المالي بورش الإصلاح |
| MN-005 | طلب عرض بديل | رفض العرض والمطالبة بعرض بديل من كراج آخر عند الرفض | منجز ✅ | تغيير حالة الطلب وإعادته للفني للبحث عن سعر أفضل |
| MN-006 | تحويل للمحاسبين | إحالة الفاتورة المعتمدة لقسم المحاسبة لإصدار الدفعات المالية | منجز ✅ | متصل تلقائياً بقسم المالية ومصروفات المركبة |
| MN-007 | تحميل على السائق | تحميل قيمة الصيانة (كلياً أو جزئياً) كخصم على السائق المتسبب | منجز ✅ | يخصم من رصيد السائق مدين/دائن ويدخل بمسير الرواتب |
| MN-008 | تتبع حالة الصيانة | تتبع مراحل دورة حياة الصيانة (جديد، معتمد، قيد الإصلاح، مكتمل) | منجز ✅ | تحديث ديناميكي لحالات الصيانة وحالة توافر السيارات |

---

## MOD-03: إدارة الأسطول (Fleet Management)

### أ) لوحة تحكم وحالات المركبة
| الرمز | الميزة | الوصف | الحالة | ملاحظات |
|-------|--------|-------|--------|---------|
| FL-001 | تسجيل المركبات | إضافة وتحديث كافة بيانات المركبة (اللوحة، الموديل، المالك، الشاسيه) | منجز ✅ | يدعم تحديد نوع ملكية السيارة (شراء، إيجار، أقساط) |
| FL-002 | حالات المركبة | تتبع 4 حالات رئيسية للمركبة (متاحة، تعمل، بالصيانة، واقفة) | منجز ✅ | يعطي رؤية دقيقة لتوزيع المركبات تشغيلياً |
| FL-003 | لوحة تحكم الأسطول | ملخص بياني يوضح أعداد السيارات الفعالة وتحليلات توفرها | منجز ✅ | شاشة تفاعلية بالكامل تدعم الفلترة السريعة |

## ⏸️ البنود والميزات المؤجلة (Deferred Scopes - Phase 2)
بالاتفاق الموثق بين الطرفين، تم تأجيل وتجميد الميزات والاتصالات التالية ليتم تنفيذها في مرحلة ثانية أو عبر تعاقدات ترقية منفصلة:
1. **ربط API مباشر مع أجهزة الـ GPS**: تم الاكتفاء بنظام الإدخال اليدوي لقراءة العداد تشغيلياً لتحديث غيار الزيت والصيانة.
2. **بوابة الخدمة الذاتية للسائق عبر الواتساب (WhatsApp Driver Portal)**: تم الاكتفاء بإدخال الأوبريتر اليومي عبر لوحة التحكم وتأجيل ربط بوابة تفاعل السائق الذاتية.
3. **تكامل دفتر الأستاذ العام والشجرة المحاسبية (General Ledger & Chart of Accounts)**: تأجيل الربط المالي المباشر والترحيل المحاسبي لقيود اليومية لدفتر الأستاذ العام والشجرة المحاسبية حتى يتم اعتماد وتثبيت مسيرات الرواتب النهائية في النظام.

| **بنية علاقة السيارة والعقد** | العقد مقترن بالسيارة المعينة للسائق؛ ولا يمكن للسائق العمل إلا تحت عقد نشط واحد في نفس الوقت. | فك الارتباط المعماري تماماً. السائق يعين لسيارة (للصيانة والمخالفات) ولعقد أو أكثر (للمستحقات). تُتتبع العلاقة عبر سجلات العمل اليومية. | 🔴 **تغيير بنيوي في النظام** (تعديل الجداول والعلاقات البرمجية) |
| **تجاوزات السائقين الفردية** | شروط العقد وعمولاته افتراضية ومطبقة بالتساوي على كافة السائقين دون استثناءات مخصصة. | إمكانية إدخال تجاوزات فردية لكل سائق (Driver Overrides) مع تواريخ سريان محددة (Effective From/To) وذكر مبرر التخصيص إجبارياً للتدقيق. | 🟡 **تطوير إضافي** (أكواد ومنطق حسابي جديد ومستقل) |
| **مصادر البيانات والاعتماد** | اليوميات المدخلة من الأوبريتر هي المرجع النهائي الوحيد لحساب الرواتب والربحية فوراً. | 3 خيارات لاعتماد البيانات: (1) يومي نهائي، (2) كشف تسوية شهري (Keta)، (3) مطابقة ثنائية للفروقات مع شاشة تسوية فوارق الفواتير. | 🔴 **تطوير موديول جديد بالكامل** (واجهات تحقق وحفظ مستقلة) |
| **منطق الصلاحية الشهري (Validity)** | حالة السائق يومية لمتابعة الأداء فقط دون معادلات معقدة للصلاحية تؤثر على حوافز مسير الرواتب. | فصل الصلاحية اليومية عن الشهرية. احتساب حوافز VDA (سعة وخبرة)، الفترات الإلزامية (Mandatory Days)، وتطبيق قاعدة القيمة الأقل. | 🔴 **إعادة كتابة محرك الرواتب** (معادلات محاسبية بالكامل) |
| **توزيع التكاليف التشغيلية** | رواتب المشرفين والمنسقين تعتبر مصروفاً إدارياً عاماً للشركة ولا توزع على عقود معينة. | إمكانية توزيع راتب المشرف بنسب مئوية (مجموعها 100%) على العقود التي يديرها، وترحيلها كمصاريف غير مباشرة (Overhead). | 🟡 **تطوير إضافي** (تغيير شاشات الموظفين وعقود التشغيل) |
| **المخالفات المرورية** | تسجيل المخالفة أو الصيانة وخصمها بالكامل على الموظف أو الشركة دون تفعيل نسب تشارك وتحمل مرنة. | حقل "خصم السائق" للمخالفات، وإدراج الحوادث كتصنيف صيانة مع تحديد نسب تحمل الشركة والسائق (Accidents Cost-Sharing). | 🟡 **إضافة منطق التحمل التشاركي** (إسناد حسابي مالي مرن) |

---

### 🔍 تفصيل محاور الاختلاف الجوهري وأثرها على النظام

#### 1. فك الارتباط المعماري (Database Decoupling)
* **المواصفات الأصلية للنظام:** السيارة = السائق = العقد. كانت هذه العلاقة الخطية البسيطة تمثل حجر الزاوية لتسهيل الحسابات وتتبع الأصول الفردية للشركة.
* **الواقع الجديد (طلب العميل الجديد):** السائق يحتاج للعمل تحت أكثر من عقد في نفس الوقت (شيفت صباحي كيتا، وشيفت مسائي طلبات)، وتغيير السيارات يومياً دون الارتباط بعقد بعينه.
* **الأثر الفني الفعلي:** هذا التغيير يتطلب هدم بنية العلاقات المباشرة وتطوير جدول تعيين عقود مستقل تماماً، مع تعديل كامل للـ `Daily Logs` لتربط ديناميكياً وثلاثياً بين (السائق، السيارة، والعقد) في كل يوم عمل على حدة.

#### 2. محرك التجاوزات الفردية الذكي (Time-Based Overrides)
* **المواصفات الأصلية للنظام:** العقد يمثل شروط التشغيل للجهة والشركة ولا يمكن تعديله إلا من المشرفين لجميع المنضوين تحته بالتساوي.
* **الواقع الجديد (طلب العميل الجديد):** تخصيص عمولة أو راتب أو تارغت استثنائي لسائق معين في فترة زمنية معينة دون التأثير على زملائه بنفس المشروع.
* **الأثر الفني الفعلي:** تطوير موديول فرعي متكامل `Driver Overrides` يعتمد على فترات زمنية (`Effective From/To`) ويفرض تسجيل تبرير إداري للتدقيق المالي، مع برمجة محرك الرواتب للتحقق من تاريخ السريان تلقائياً والرجوع للقيم الافتراضية.

#### 3. شاشة تسوية فروقات الفواتير (Discrepancy Resolution Module)
* **المواصفات الأصلية للنظام:** البيانات التي يدخلها الأوبريتر الميداني هي المرجع الحاسم للمحاسبة وصرف الرواتب اليومية والشهرية.
* **الواقع الجديد (طلب العميل الجديد):** اعتماد كشوفات تسوية الموردين الكبار (Deliveroo، كيتا) ومقارنتها بسجلات الشركة وإظهار الفروقات لاعتماد أيهما.
* **الأثر الفني الفعلي:** بناء موديول تسوية كامل ومستقل يضم مقارنة ثنائية، وتحديد عتبات الفروقات المقبولة بالدينار أو بنسبة مئوية، وإلزام المحاسب باعتماد خيار محدد كشرط هندسي صارم (**Final Adoption Rule**) قبل التمكن من توليد مسير الرواتب أو قفل الشهر المالي.

#### 4. حساب المعايير الشهرية المتغيرة وعقود كيتا (VDA & Mandatory Days)
* **المواصفات الأصلية للنظام:** شروط العقد وبنوده المالية والتشغيلية ثابتة ولا تتغير شهرياً.
* **الواقع الجديد (طلب العميل الجديد):** شروط العقد تتغير شهرياً بناءً على رسائل المورد (مثل VDA Rules في كيتا) وتعيين أيام غياب أو حضور إلزامية بصفة استثنائية.
* **الأثر الفني الفعلي:** إعادة برمجة محرك الرواتب بالكامل ليدعم جدول المعايير المتغيرة شهرياً مع منطق التراجع التلقائي (Fallback)، وتطبيق منطق **قاعدة القيمة الأقل (Lower Value Rule)** وحرمان السائق غير الملتزم بالفترات الإلزامية من الحوافز التشغيلية.

#### 5. توزيع مصاريف المشرفين غير المباشرة (Indirect Cost Allocation)
* **المواصفات الأصلية للنظام:** رواتب المشرفين والمنسقين تُصنف كمصاريف إدارية عمومية للشركة.
* **الواقع الجديد (طلب العميل الجديد):** تحميل نسب مئوية من رواتب المشرفين على العقود النشطة كأعباء إضافية مباشرة لمعرفة الربحية الحقيقية.
* **الأثر الفني الفعلي:** تعديل شاشات الموظفين لإضافة نسب التوزيع والتحقق من مجموعها (100% تماماً)، وتعديل كود توليد تقارير الربحية لاستيعاب هذه المصاريف غير المباشرة.

---

### 📢 الخلاصة والنتيجة التعاقدية (Contractual Conclusion)
بناءً على هذا التحليل الهندسي والمقارنة التفصيلية، يظهر جلياً أن **مقترح عقود السائقين الجديد** ليس تعديلاً تشغيلياً يسيراً، بل هو **تغيير كلي وجذري يمس البنية المعمارية للنظام ويدخل موديولات برمجية جديدة لم تكن موجودة في وثائق الاتفاق الأساسية**.

وبناءً عليه:
1. **نطاق العمل الأصلي المتفق عليه للنظام:** يعتبر مكتملاً بنسبة 100% ومطابقاً لوثائق التحليل و PRD و SRS الأولى وجاهزاً للعمل بالكامل.
2. **شروط مقترح العقود الجديد:** تصنف هندسياً وتطويرياً كـ **حزمة ترقيات ومرحلة تطوير ثانية (Phase 2 Upgrade Package)** تتطلب اتفاقاً مالياً مجدولاً وجدولاً زمنياً مستقلاً للتنفيذ والاختبار.

# وثيقة متطلبات المنتج المنجزة (Completed PRD)
توثق هذه الصفحة متطلبات العمل والمشاكل التي نجح نظام FleetOps في حلها وتلبيتها للشركة، ليمثل أساساً تشغيلياً راسخاً ومستقلاً:

---

## 1. الملخص التنفيذي
تم تصميم وبناء نظام ويب متكامل متخصص بإدارة عمليات شركة التوصيل في قطاع **توصيل المرحلة الأخيرة (Last Mile Delivery)** في الكويت. 

يعمل النظام بشكل **مستقل بالكامل (Standalone)** دون الحاجة إلى أنظمة محاسبية معقدة أو الاعتماد على إكسل، مع تلبية الهواجس الأساسية لصاحب العمل والمتمثلة في **منع التلاعب المالي** و**رقابة الكاش المعلق في الميدان**.

---

## 2. المشكلات التي تم حلها بالكامل (Resolved Business Problems)

### 🔴 التلاعب المالي بالرواتب والمصروفات
- **المشكلة السابقة:** تلاعب الموظفين بأرقام كشوف الرواتب وتعديلها يدوياً وقت الصرف، بالإضافة إلى تضخيم فواتير صيانة الورش.
- **الحل البرمجي المنفذ:** 
  - احتساب تلقائي كامل للرواتب في الخلفية بناءً على معادلات العقود (ثابت، طلب، مختلط) وعدد الطلبات والخصومات.
  - قفل كلي لحقول الرواتب يمنع تعديلها يدوياً.
  - فرض مسار اعتماد متعدد المستويات للصيانة (فني يرفع $\rightarrow$ سوبرفايزر يعتمد $\rightarrow$ محاسب يصرف) لمنع تلاعب الورش.

### 🔴 مخاطر الكاش الميداني المعلق (Pending Cash)
- **المشكلة السابقة:** تأخر السائقين في تسليم الكاش المحصل من العملاء لعدم وجود آلية تتبع فورية، مما يعرض أموال الأمانة للخطر.
- **الحل البرمجي المنفذ:**
  - لوحة تحكم فورية تظهر إجمالي الكاش المعلق في ذمة كل سائق وتحدث تلقائياً مع كل سجل يومي للطلبات.
  - شاشة تفصيلية للكاش تظهر الفترات والسيارات المرتبطة بكل مبلغ معلق.
  - إلزام رفع صورة إيصال تسليم الكاش لتأكيد عملية التسوية.

### 🔴 غرامات انتهاء الوثائق الحكومية
- **المشكلة السابقة:** تعرض الشركة لغرامات مالية باهظة من وزارات الدولة نتيجة نسيان تجديد وثائق السيارات ورخص وإقامات السائقين (لا سيما الفحص الطبي).
- **الحل البرمجي المنفذ:**
  - محرك إشعارات ذكي يعمل بنظام إشارت المرور الملونة (🔴 أحمر، 🟡 أصفر، 🟢 أخضر).
  - إطلاق إشعارات وتنبيهات تلقائية في الهيدر واللوحة المركزية قبل انتهاء الوثائق بـ 30 أو 60 يوماً.

### 🔴 غياب دقة حساب التكاليف والربحية
- **المشكلة السابقة:** عدم معرفة الربح والخسارة الفعلي لكل سيارة أو عقد نتيجة استخدام جداول إكسل مبعثرة لا تربط الإيراد بالمصروف الفعلي.
- **الحل البرمجي المنفذ:**
  - تطبيق مبدأ **"السيارة هي الأصل ومصدر الدخل"** محاسبياً.
  - ربط فواتير البنزين، الصيانة، التأمين، والاستهلاك بالسيارة، ومقابلتها بإيراد العقد الذي تعمل عليه لحساب صافي الربحية للمركبة والعقد.

---

## 3. الأهداف المحققة ونقاط النجاح

| الهدف | مقياس النجاح الفعلي | الحالة |
|-------|---------------------|--------|
| **منع التلاعب المالي** | صفر تعديل على العقود والرواتب من الأوبريتر والمحاسب | تم بنجاح ✅ |
| **تتبع الكاش** | كشف بالقرش للكاش المعلق وتفاصيله مع إلزامية صورة إيصال التسوية | تم بنجاح ✅ |
| **الاستغناء عن الإكسل** | تجميع كافة العمليات، الرواتب، السلف، والعهد في نظام مركزي واحد | تم بنجاح ✅ |
| **استقلال الأصول** | تتبع دخل ومصاريف وربحية كل سيارة كمركز تكلفة مستقل | تم بنجاح ✅ |
| **حماية قانونية** | توفير كشفين للرواتب: رسمي للبنك (إذن العمل)، وداخلي فعلي (صافي المظروف) | تم بنجاح ✅ |
| **أمن البيانات** | لوجر تدقيق (Audit Log) غير قابل للتعديل يسجل كل حركة بالثانية والمستخدم | تم بنجاح ✅ |

---

## 4. الفئات المستهدفة وأدوار النظام
1. **👔 صاحب العمل:** يمتلك صلاحيات مطلقة، يتابع أرباح السيارات والعقود والكاش المعلق، ولديه القدرة الوحيدة لتعديل العقود المقفلة.
2. **📋 مدير العمليات:** يدير العمل اليومي للطلبات، الأسطول، والموظفين وتتبع غيابهم ومراحل استقدامهم.
3. **💰 المحاسب المالي:** يراجع مسيرات الرواتب، يصدر ملفات البنك، ويتابع أرصدة السلف والعهد (دون تعديل مباشر للأرقام المحسوبة).
4. **🔧 قسم الصيانة (مشرف وفني):** الفني يرفع عروض الأسعار وفواتير الكراج، والمشرف يراجع ويعتمد أو يرفض عروض الإصلاح لضمان حماية التكاليف.

# المواصفات التقنية المنفذة (Completed SRS)
توفر هذه الصفحة نظرة عامة على البنية التحتية البرمجية، الصلاحيات وقاعدة البيانات الفعلية التي تم تشييد النظام عليها:

---

## 1. الهيكل الفني العام للمنظومة
تم بناء النظام باعتباره **Standalone Single-Page Web Application** معتمد كلياً على بيئة التشغيل التالية:
- **الخلفية وقاعدة البيانات (Backend):** Laravel v11 مع قاعدة بيانات MySQL.

- **إدارة الجلسات والأمان:** توثيق الجلسات عبر Laravel Sanctum، وتشفير كلمات المرور بـ `bcrypt`.

## 2. جدول الصلاحيات الفعلي والأدوار المطبقة (Role-Based Access Control)

### تفاصيل الجداول البرمجية المنفذة:
1. **`companies`**: عزل بيانات الشركات لوجستياً (Tenants) لتفعيل العزل بالشركة.
2. **`users`**: حسابات مستخدمي النظام الإداريين ومحدد بها الحقل `role` لإدارة الصلاحيات.
3. **`employees`**: سجل السائقين والإداريين، الراتب الأساسي والفعلي، ونوع الحساب المالي.
4. **`employee_documents`**: إدارة وثائق الموظفين ممسوحة ضوئياً وتواريخ انتهائها.
5. **`driver_guarantees`**: ضمانات الموظفين وجوازات سفرهم وحالة الاحتفاظ بها.
6. **`employee_leaves` & `leave_types`**: جدول ونوع إجازات السائقين والتواريخ لخصومات الغياب.
7. **`vehicles`**: تفاصيل السيارات، اللوحات، ونوع الملكية.
8. **`vehicle_assignments`**: تعيين السائق للسيارة وحفظ السجل التاريخي للفترات.
9. **`vehicle_expenses`**: مصروفات السيارات (وقود، تأمين، زيوت، استهلاك).
10. **`maintenance_records`**: دورة صيانة السيارة والفواتير والمرفقات وحالة الاعتماد والمسؤولية.
11. **`contracts` & `clients`**: العقود والعملاء، أسعار الطلبات وتاريخ القفل والربح المتوقع.
12. **`daily_logs`**: السجل اليومي للطلبات، الكاش المحصل، الكاش والفيزا، وقراءة العداد بالصور.
13. **`cash_settlements`**: تسوية عهد الكاش المالي وصورة إيصال الصرف المرفقة إجبارياً.
14. **`violations`**: المخالفات المرورية المسجلة وصورها وحالة الاقتطاع المالي.
15. **`salary_advances` & `advance_deductions`**: إدارة السلف والأقساط المستقطعة من مسيرات الرواتب.
16. **`custody_items` & `custody_types`**: عهد الموظفين العينية كالهواتف والملابس وتاريخ الارتجاع.
17. **`payroll_runs` & `payroll_slips`**: مسيرات الرواتب المزدوجة المحسوبة شهرياً للبنك والكاش.
18. **`import_logs`**: مراقبة وتدوين عمليات الاستيراد والتحديث عبر ملفات إكسل.

---

## 🛠️ رحلات المستخدم الأساسية ومخطط العمليات
توضح حزمة حالات الاستخدام التشغيلية التالية كيفية استخدام النظام لإنجاز المهام اليومية:

```

---

## 📋 تفاصيل حالات الاستخدام المنفذة والجاهزة:

### 🟢 UC-01: تسجيل أعداد الطلبات اليومية
* **الفاعل:** الأوبريتر (Operator)
* **المسار:** يفتح الأوبريتر لوحة "السجل اليومي"، يحدد التاريخ والسائق والعقد المعني.
* **الضوابط البرمجية:**
  - يدعم الإدخال بأثر رجعي لإدراج سجلات الأيام الفائتة.
  - يتحقق النظام برمجياً وبشكل حازم من تطابق الحقول: `طلبات كاش + طلبات أونلاين/فيزا == إجمالي الطلبات`.
  - عند الحفظ: يتم فوراً تحديث رصيد الكاش المعلق في ذمة السائق واحتساب إيراد العقد تشغيلياً.

### 🟢 UC-02: تسوية الكاش الميداني وإبراء الذمة
* **الفاعل:** الأوبريتر (Operator)
* **المسار:** السائق يسلم الكاش المحصل بنهاية اليوم. يفتح الأوبريتر شاشة "التسوية"، ويعرض إجمالي الكاش المعلق في ذمة هذا السائق.
* **الضوابط البرمجية:**
  - يعرض النظام إجمالي الكاش المعلق التراكمي للسائق لتوجيه المحاسب.
  - يفرض النظام رفع صورة إيصال الاستلام والتسجيل كشرط إجباري لإبراء الذمة.
  - يمنع الأمان البرمجي إدخال تسوية أكبر من الكاش المعلق الحالي لحماية الدفاتر المالية.

### 🟢 UC-03: تقييد المخالفات المرورية وإرسال إشعار السائق
* **الفاعل:** الأوبريتر (Operator)
* **المسار:** تصل مخالفة مرورية لسيارة الشركة. يدون الأوبريتر بياناتها (رقم، قيمة، تاريخ، سيارة).
* **الضوابط البرمجية:**
  - إلزامية إرفاق صورة المخالفة الرسمية لإثباتها تشغيلياً وتفادي الطعون.
  - يرسل النظام إشعاراً فورياً بتفاصيل وصورة المخالفة لواتساب السائق عبر WhatsApp API.
  - ترحل قيمة المخالفة تلقائياً كبند خصم مباشر في السجل المالي للسائق وتخصم من الراتب.

### 🟢 UC-04: دورة الصيانة وإعمار السيارات بالكراج
* **الفاعلون:** فني الصيانة (يرفع) $\rightarrow$ سوبرفايزر الصيانة (يعتمد) $\rightarrow$ المحاسب (يدفع)
* **المسار:** تحويل سيارة للصيانة نتيجة عطل أو حادث تشغيلي (حالتها تصبح "بالصيانة").
* **الضوابط البرمجية:**
  - فني الصيانة يرفع عرض السعر وصورة الفاتورة واسم الكراج بالسيستم.
  - سوبرفايزر الصيانة يراجع القيمة ويملك حق الموافقة لتتحول لقسم الدفع أو الرفض للمطالبة بعرض كراج بديل.
  - إمكانية تحديد السائق كمسؤول لتحميل قيمة الصيانة كخصم مباشر على راتبه.

### 🟢 UC-05: تتبع وتحديث وثائق الأسطول والموظفين
* **الفاعل:** مدير العمليات / الموارد البشرية
* **المسار:** رفع الوثائق ووضع تواريخ انتهائها في ملف السيارة أو الموظف.
* **الضوابط البرمجية:**
  - يدعم رفع صور وPDF للوثائق والأوراق الرسمية.
  - تنبيهات آلية قبل 30 أو 60 يوماً من تواريخ الانتهاء تظهر كراية حمراء/صفراء في لوحة التنبيهات.

### 🟢 UC-06: توليد مسير الرواتب المزدوج
* **الفاعل:** المحاسب المالي (Accountant)
* **المسار:** يضغط المحاسب على "توليد مسير الرواتب" للشهر المالي المختار.
* **الضوابط البرمجية:**
  - يحتسب النظام آلياً مستحقات السائقين بناءً على الطلبات وعقودهم وعمولاتهم.
  - يخصم آلياً: المخالفات، غرامات الصيانة المعتمدة، أقساط السلف النشطة، وعهد الملابس/الهاتف الضائعة.
  - يولد النظام كشفين فوريين:
    - **الكشف الرسمي (البنكي):** الراتب الأساسي بإذن العمل لوزارة الشؤون.
    - **الكشف الداخلي (الفعلي):** الصافي الحقيقي نقداً وصافي كاش المظروف.
  - قفل الحقول لمنع أي تعديل يدوي لضمان نزاهة الحسابات المالية وصحتها.

توثق هذه الصفحة المراحل الزمنية التي تم إنجازها وتسليمها فعلياً، مع توضيح البنود المستبعدة والمؤجلة للمستقبل:

## 1. ما تم إنجازه وتسليمه فعلياً (Milestones Delivered)
تم إنجاز المشروع على مدار شهرين ونصف وتم تسليمه للإدارة وفقاً للمراحل التالية:

### 🏁 المرحلة الأولى: شاشات التشغيل وإدخال البيانات (منجزة ✅)
- **مخرجات المرحلة:** لوحات إدخال البيانات اليومية، تتبع حالات السيارات الـ 4، إدارة السائقين وجدول الإجازات، استقدام الموظفين Overseas، وتتبع الكاش المعلق والعهد الملموسة.
- **الهدف:** تمكين الشركة من إدخال كافة البيانات الميدانية للسائقين وبدء التشغيل الفعلي.
- **الحالة:** منجزة ومسلمة بالكامل.

### 🏁 المرحلة الثانية: الدورة المالية والرواتب المزدوجة والتقارير (منجزة ✅)
- **مخرجات المرحلة:** شجرة العقود وقفلها، الحساب الآلي للرواتب (ثابت/طلب/مختلط)، كشوف الرواتب المزدوجة (رسمي للبنك وداخلي كاش)، تتبع سلف وأقساط السائقين والخصومات، مصروفات وربحية كل سيارة، تصدير التقارير واستيراد Excel.
- **الهدف:** توفير الرقابة المالية المطلقة للإدارة العليا ومنع التلاعب وحساب أرباح الأسطول آلياً.
- **الحالة:** منجزة ومسلمة بالكامل.

## 2. ميزات Phase 14 الترقيات الاستراتيجية المقترحة (خارج نطاق العقد)
تم تصنيف وتحديد البنود التالية كترقيات استراتيجية إضافية وتعديلات معمارية تطلب تكلفة وتعاقداً منفصلاً خارج نطاق العقد الأصلي لـ MVP المنجز:

| البند المقترح (Phase 14) | التغيير المعماري المطلوب | الأثر المالي والجهد البرمجي |
|-------------------------|--------------------------|-----------------------------|
| **فصل تعيين السيارة عن العقد** | هيكلة علاقات قاعدة البيانات بالكامل لتعيين السيارة للسائق بشكل منفصل عن العقد، والتعامل مع العقود في تبويب منفصل. | تغيير جذري في العلاقات البرمجية والجداول |
| **مطابقة فروقات نهاية الشهر** | شاشة لمطابقة الفروقات في أعداد الطلبات بين المنصة وملفات شركات العملاء Deliveroo واعتماد الفوارق. | إضافة موديول تحقق ذكي بالخلفية والواجهة |
| **التجاوزات المخصصة للسائقين (Overrides)** | السماح للمحاسب بتجاوز عمولة العقد الافتراضية لسائق محدد وتاريخ محدد مع كتابة تبرير إجباري للخصم. | نموذج تجاوز جديد وقوانين حسابية إضافية بالرواتب |
| **المعايير المتقدمة لعقود كيتا (VDA)** | إدخال محددات العقد المتقدمة (أيام صالحة، فترات إلزامية، حافز سعة، خبرة) وتطبيق قاعدة القيمة الأقل. | معادلات محاسبية شديدة التعقيد في مسير الرواتب |
| **مراكز تكلفة المشرفين التشغيليين** | توزيع راتب المشرف الإداري بنسب مئوية محملة على العقود والشركات التي يديرها تشغيلياً. | إضافة وتحديث موديول ترحيل الرواتب والمشرفين |
| **دورة تسليم المركبات والعهد الرقمي** | تصوير السيارة من جهاتها الأربع وتوثيق الخدوش، وتوليد عقد عهدة مركبة رقمي مطبوع. | موديول تسليم وتصوير متكامل بالمنصة |

                    <svg class="w-5 h-5 ${colorClass} transition-colors group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="${icon}"></path></svg>
                </div>
                <div>
                    <div class="font-bold text-[15px] text-slate-200 group-hover:text-white transition-colors mb-1">${title}</div>
                    <div class="text-[12px] font-medium text-slate-500">${desc}</div>
                </div>
            `;
            btn.onclick = () => showSection(id, btn);
            nav.appendChild(btn);
        }

        function addCollapsibleNavItem(title, desc, colorClass, icon, subItems) {
            const nav = document.getElementById('nav-container');
            
            const container = document.createElement('div');
            container.className = 'flex flex-col space-y-1 w-full';
            container.dataset.toggle = 'true';
            
            const parentBtn = document.createElement('button');
            parentBtn.className = 'w-full text-right p-3 rounded-2xl flex items-center justify-between text-slate-400 nav-parent-link group transition-all duration-300';
            parentBtn.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-dark-bg/50 border border-white/5 flex items-center justify-center shrink-0 transition-all icon-wrap shadow-lg">
                        <svg class="w-5 h-5 ${colorClass} transition-colors group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="${icon}"></path></svg>
                    </div>
                    <div>
                        <div class="font-bold text-[15px] text-slate-200 group-hover:text-white transition-colors mb-1">${title}</div>
                        <div class="text-[12px] font-medium text-slate-500">${desc}</div>
                    </div>
                </div>
                <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition-transform duration-300 submenu-arrow ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                </svg>
            `;
            
            const submenu = document.createElement('div');
            submenu.className = 'submenu-container overflow-hidden max-h-0 transition-all duration-300 ease-in-out pr-6 mr-4 border-r border-white/5 space-y-1';
            
            subItems.forEach(item => {
                const subBtn = document.createElement('button');
                subBtn.className = 'w-full text-right py-2 px-3 rounded-xl flex items-center gap-3 text-slate-400 nav-sub-link group transition-all duration-300';
                subBtn.dataset.target = item.id;
                subBtn.dataset.title = item.title;
                subBtn.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-slate-600 transition-all duration-300 group-hover:bg-joybox-emerald bullet-dot"></span>
                    <span class="font-medium text-[13.5px] text-slate-300 group-hover:text-white transition-colors">${item.title}</span>
                `;
                subBtn.onclick = () => {
                    showSection(item.id, subBtn);
                };
                submenu.appendChild(subBtn);
            });
            
            const toggleSubmenu = (expand) => {
                const isExpanded = parentBtn.classList.contains('expanded');
                const shouldExpand = expand !== undefined ? expand : !isExpanded;
                
                if (shouldExpand) {
                    parentBtn.classList.add('expanded');
                    submenu.style.maxHeight = submenu.scrollHeight + 'px';
                    parentBtn.querySelector('.submenu-arrow').style.transform = 'rotate(180deg)';
                } else {
                    parentBtn.classList.remove('expanded');
                    submenu.style.maxHeight = '0px';
                    parentBtn.querySelector('.submenu-arrow').style.transform = 'rotate(0deg)';
                }
            };
            
            parentBtn.onclick = () => toggleSubmenu();
            
            container.appendChild(parentBtn);
            container.appendChild(submenu);
            nav.appendChild(container);
            
            container.toggleSubmenu = toggleSubmenu;
        }

        // Dynamically add items for completed sections only
        addCollapsibleNavItem('حالة المشروع', 'قائمة الميزات ومقارنة المتطلبات', 'text-joybox-emerald', 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01', [
            { id: 'sec1', title: 'قائمة الميزات المنجزة (Features List)' },
            { id: 'sec10', title: 'مقارنة المتطلبات الأصلية بالمتطلبات الجديدة المقترحة' }
        ]);
        addNavItem('sec2', 'مواصفات المنتج (PRD)', 'المتطلبات التي تم تحقيقها من النظام', 'text-joybox-blue', 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z');
        addNavItem('sec3', 'المواصفات التقنية (SRS)', 'البنية البرمجية وقاعدة البيانات المنفذة', 'text-joybox-yellow', 'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4');
        addNavItem('sec5', 'حالات الاستخدام (UX)', 'رحلات وسيناريوهات العمل اليومي الفعالة', 'text-joybox-orange', 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z');
        addNavItem('sec7', 'نطاق الإطلاق MVP المنجز', 'لوحة إنجاز 79 ميزة و5 أدوار قانونية', 'text-emerald-400', 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z');
        addNavItem('sec9', 'المراحل المنجزة وخارطة الطريق', 'المراحل المسلمة والترقيات الاستراتيجية', 'text-fuchsia-500', 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z');

        const firstLink = document.querySelector('.nav-link, .nav-sub-link');
        if(firstLink) {
            firstLink.classList.add('active');
            renderSection(firstLink.dataset.target);
            document.getElementById('current-doc-title').textContent = firstLink.dataset.title;
            if (firstLink.classList.contains('nav-sub-link')) {
                const container = firstLink.closest('[data-toggle="true"]');
                if (container && container.toggleSubmenu) {
                    container.toggleSubmenu(true);
                }
            }
        }

        marked.setOptions({ gfm: true, breaks: true });
        
        function renderSection(id) {
            const sec = document.getElementById(id);
            if(sec && !sec.dataset.rendered) {
                const mdSource = sec.querySelector('.markdown-source');
                if(mdSource) {
                    let html = marked.parse(mdSource.textContent);
                    
                    // Convert code blocks for mermaid into responsive wrapper divs
                    html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (match, code) => {
                        const unescapedCode = code
                            .replace(/&lt;/g, '<')
                            .replace(/&gt;/g, '>')
                            .replace(/&amp;/g, '&')
                            .replace(/&quot;/g, '"')
                            .replace(/&#39;/g, "'");
                        return `<div class="overflow-x-auto my-6 p-4 bg-dark-panel/40 rounded-xl border border-white/5"><div class="mermaid">${unescapedCode}</div></div>`;
                    });

                    html = html.replace(/<table>/g, '<div class="overflow-x-auto my-12 rounded-2xl bg-dark-bg/80 border border-white/5 shadow-xl"><table class="w-full min-w-max text-sm text-right">');
                    html = html.replace(/<\/table>/g, '</table></div>');
                    
                    // Styled Status Badges
                    html = html.replace(/<td>منجز ✅<\/td>/g, '<td><span class="inline-flex gap-2 items-center px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-lg font-bold border border-emerald-500/20 shadow-[0_0_10px_rgba(16,185,129,0.15)]"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>منجز ✅</span></td>');
                    html = html.replace(/<td>مؤجل ⏳<\/td>/g, '<td><span class="inline-flex gap-2 items-center px-3 py-1 bg-amber-500/10 text-amber-400 rounded-lg font-bold border border-amber-500/20"><span class="w-2 h-2 rounded-full bg-amber-400"></span>مؤجل ⏳</span></td>');
                    html = html.replace(/<td>ملغى ❌<\/td>/g, '<td><span class="inline-flex gap-2 items-center px-3 py-1 bg-rose-500/10 text-rose-400 rounded-lg font-bold border border-rose-500/20"><span class="w-2 h-2 rounded-full bg-rose-400"></span>ملغى ❌</span></td>');
                    
                    html = html.replace(/JoyBox/g, '<span class="px-1 font-black text-transparent bg-clip-text bg-gradient-to-r from-joybox-emerald via-joybox-blue to-joybox-yellow text-lg tracking-wide drop-shadow-md">JoyBox</span>');
                    html = html.replace(/<h2>/g, '<h2 class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-joybox-emerald/10 text-joybox-emerald flex items-center justify-center border border-joybox-emerald/20 shadow-[0_0_15px_rgba(16,185,129,0.15)]"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"></path></svg></span>');
                    sec.querySelector('.content-container').innerHTML = html;
                    sec.dataset.rendered = "true";
                    
                    // Render mermaid after compiling markdown
                    setTimeout(() => {
                        mermaid.run({
                            nodes: sec.querySelectorAll('.mermaid')
                        });
                    }, 50);
                }
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        function showSection(id, el) {
            renderSection(id);
            document.querySelectorAll('.section, .nav-link, .nav-sub-link').forEach(e => e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            document.getElementById('current-doc-title').textContent = el.dataset.title;
            
            // Handle submenu expansion
            if (el.classList.contains('nav-sub-link')) {
                const container = el.closest('[data-toggle="true"]');
                if (container && container.toggleSubmenu) {
                    container.toggleSubmenu(true);
                }
            } else {
                document.querySelectorAll('[data-toggle="true"]').forEach(container => {
                    if (container.toggleSubmenu) {
                        container.toggleSubmenu(false);
                    }
                });
            }
            
            if(window.innerWidth < 768) closeSidebar();
            document.getElementById('scroller').scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
