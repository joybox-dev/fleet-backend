# Feature List v2 — نظام إدارة أسطول التوصيل (Last Mile Delivery Fleet Management System)

**إصدار الوثيقة:** 2.0  
**التاريخ:** 2026-03-08  
**المرجع:** محضر اجتماع **JoyBox** مع العميل (أبو حضرم)  
**الحضور:** العميل (أبو حضرم) — مهندس عمرو — مهندس همام — المحاسب (أبو محمد) عبر الهاتف  

---

> **ملاحظة عامة:** الترتيب يتبع مجرى نقاش الاجتماع وأولوية الحاجة التشغيلية.  
> النظام يخدم حالياً مرحلة **Last Mile** فقط، مع تصميم قابل للتوسع لاحقاً ليشمل التخزين والتوزيع.

---

## MOD-01: إدارة العمليات (Operations) — القلب التشغيلي

> أول ما بدأ العميل بالحديث عنه، وهو الأهم يومياً: إدخال الطلبات، تتبع الكاش، المخالفات، والحوادث.

### أ) إدخال الطلبات وتسجيل العمل اليومي

| الرمز | الميزة | الوصف | الأولوية | ملاحظات من الاجتماع |
|--------|--------|-------|----------|---------------------|
| OP-001 | السجل اليومي للطلبات | إدخال يومي يشمل: اسم السائق + العقد/الشركة + عدد الطلبات + الكاش المحصّل | عالية | الإدخال حالياً يدوي بالكامل عبر واتساب أو من داشبورد الشركة المتعاقدة |
| OP-002 | إدخال بأثر رجعي | إمكانية إدخال بيانات أيام سابقة (مرونة في التأخير) | عالية | السائق مشغول 12 ساعة وقد يتأخر بالإبلاغ |
| OP-003 | ربط الطلب بالعقد | كل إدخال مرتبط بعقد محدد (لأن السائق/السيارة ممكن ينتقل بين عقود بنفس اليوم) | عالية | المحاسب أكد أن السيارة ممكن تنتقل بين عقود بنفس اليوم |
| OP-004 | التحقق من الداشبورد الخارجي | إمكانية مقارنة البيانات المدخلة مع داشبورد الشركة المتعاقدة (يدوياً حالياً) | متوسطة | السائق يرسل عدد الطلبات عبر واتساب أو يتم التحقق من داشبورد الشركة |

> **لا يوجد تطبيق للسائقين** — تم تجربته سابقاً وفشل لأن السائقين غير متعلمين ومشغولين 12 ساعة. كل الإدخال يتم من طرف الأوبريتر.

---

### ب) إدارة الكاش والعهدة

| الرمز | الميزة | الوصف | الأولوية | ملاحظات من الاجتماع |
|--------|--------|-------|----------|---------------------|
| OP-005 | تتبع الكاش المعلق | عرض المبالغ النقدية المعلقة عند كل سائق مع ربطها بالطلبات المحددة | عالية | "الفلوس المعلقة خطيرة لأنها أمانة وليست ملك الشركة" |
| OP-006 | تفاصيل الكاش المعلق | الضغط على المبلغ المعلق يعرض: أسماء السائقين + السيارات + تفصيل المبالغ لكل طلب | عالية | مطلوب لاتخاذ قرار سريع |
| OP-007 | تسليم العهدة (إبراء الذمة) | تسجيل تسليم الكاش مع: المبلغ المسلّم + تصوير إيصال التسليم + تأكيد الإبراء | عالية | التسليم = تسوية + تصوير إيصال |
| OP-008 | لوحة تحكم الكاش | عرض مركزي: عدد الطلبات المكتملة + إجمالي الكاش المعلق عند كل سائق | عالية | أول شيء يراه المدير في لوحة التحكم |
| OP-008B | القِسم المتكامل للعهد | إدارة العهد: أصول مالية، ملابس، هواتف، شرائح، كاش — تتبع حالة كل عهدة منفصلة | عالية | متطلب جديد: قسم متكامل للعهد |
| OP-008C | ضمانات السائقين | جواز السفر + أي مستندات ضمان أخرى — مرتبط بقسم الموارد البشرية | عالية | متطلب جديد: ضمانات مرتبطة بالـ HR |

---

### ج) المخالفات المرورية

| الرمز | الميزة | الوصف | الأولوية | ملاحظات من الاجتماع |
|--------|--------|-------|----------|---------------------|
| OP-009 | تسجيل المخالفات بالصورة | إدخال مخالفة مرورية + **صورة إلزامية** فوراً: السائق المسؤول + القيمة + التاريخ + التفاصيل | عالية | تحديث: إضافة صورة المخالفة |
| OP-009B | إرسال المخالفة عبر واتساب | إرسال المخالفة مباشرة للسائق عبر واتساب (رسالة تلقائية أو يدوية) | عالية | متطلب جديد: تكامل واتساب |
| OP-010 | إثبات المخالفة للسائق | تسجيل مرجعي يمكن للسائق الاطلاع عليه أو الحصول على نسخة منه | عالية | "مطلوب إثبات مسجل للسائق ليطمئن" |
| OP-011 | خصم المخالفات تلقائياً | ربط المخالفة بحساب السائق وخصمها تلقائياً وقت صرف الرواتب | عالية | تُخصم من رصيد السائق وقت الصرف |

---

### د) الحوادث وسير عمل الصيانة

| الرمز | الميزة | الوصف | الأولوية | ملاحظات من الاجتماع |
|--------|--------|-------|----------|---------------------|
| OP-012 | الإبلاغ عن حادث | الأوبريشن يرفع بلاغ حادث مع صور السائق + تفاصيل الحادث | عالية | "السائق يصور ويرسل للأوبريشن" |
| OP-013 | تحويل السيارة للصيانة | إمكانية تحويل السيارة للصيانة (لكن التحويل **ليس إلزامياً**، بل اختياري حسب طبيعة الحادث) | عالية | تحديث: التحويل اختياري |

---

### هـ) لوحة تحكم العمليات

| الرمز | الميزة | الوصف | الأولوية | ملاحظات من الاجتماع |
|--------|--------|-------|----------|---------------------|
| OP-014 | داشبورد العمليات | ملخص شامل: إجمالي السائقين النشطين / الطلبات اليومية / الكاش المعلق / المخالفات الجديدة / سيارات بالصيانة | عالية | النظام لا يحتاج أن يكون Live بالثانية، نهاية اليوم كافية |
| OP-015 | إدارة السائقين والغياب | ربط عدد السائقين في الإجازة بجدول الإجازات، وتتبع المتغيبين عن العمل يومياً | عالية | متطلب عمليات جديد |
| OP-016 | إحصائيات الغياب والعجز | تحديد عدد السائقين المطلوب لكل براند، وإظهار العجز في أعداد الطاقم كقيمة سالبة واضحة | عالية | متطلب عمليات جديد لتوزيع الطاقم |

## MOD-02: إدارة الصيانة (Maintenance)

> ذُكرت مباشرة بعد الحوادث كامتداد طبيعي لسير العمل.

| الرمز | الميزة | الوصف | الأولوية | ملاحظات من الاجتماع |
|--------|--------|-------|----------|---------------------|
| MN-001 | استلام طلب صيانة | استلام السيارة من الأوبريشن تلقائياً مع الصور والتفاصيل المرفقة | عالية | — |
| MN-002 | التوجيه للكراج | فني الصيانة يسجل أخذ السيارة للكراج + تصوير الحالة | عالية | "قسم الصيانة يأخذ السيارة للكراج → يصور" |
| MN-003 | رفع فاتورة/عرض سعر | رفع فاتورة الكراج أو عرض السعر مع الصور | عالية | "يرفع الفاتورة" |
| MN-004 | موافقة السوبرفايزر | السوبرفايزر يراجع القيمة ويوافق أو يرفض | عالية | "لمنع التلاعب بالأسعار" — نقطة جوهرية |
| MN-005 | طلب عرض بديل | عند الرفض، إمكانية طلب عرض سعر من كراج آخر | متوسطة | — |
| MN-006 | تحويل للمحاسبين | بعد الموافقة تتحول الفاتورة للمحاسبين لإصدار الدفعة | عالية | "بعد الموافقة تمشي الدفعات مع المحاسبين" |
| MN-007 | تحميل على السائق | إذا السائق متسبب، تُحسب تكلفة الصيانة كغرامة/خصم عليه | متوسطة | "90% على الشركة إلا إذا السائق متسبب" |
| MN-008 | متابعة حالة الصيانة | تتبع: قيد المراجعة → موافق → جاري الإصلاح → مكتمل | عالية | — |
| MN-009 | سجل صيانة المركبة | أرشيف كامل لكل عمليات الصيانة لكل سيارة | متوسطة | — |

## MOD-03: إدارة الأسطول (Fleet Management)

> الوحدة الثالثة بالترتيب في الاجتماع — كل ما يخص السيارات كأصل.

### أ) حالات السيارة ولوحة التحكم

| الرمز | الميزة | الوصف | الأولوية | ملاحظات من الاجتماع |
|--------|--------|-------|----------|---------------------|

| HR-002 | نوع الانضمام | تحديد نوع الموظف: **Overseas** (من الخارج) أو **تحويل داخلي** (يعمل أصلاً بالكويت) | عالية | التحويل الداخلي = يوم واحد فقط |

| HR-006 | فترة التجربة | تتبع فترة التجربة (3 أشهر) مع تنبيه + تحويل تلقائي لـ "غير فعال" عند الخروج | متوسطة | "ممكن الموظف يمشي بعد شهر أو شهرين" |

## MOD-05: الإدارة المالية (Finance)

> المحاسب أبو محمد شارك عبر الهاتف وأكد أن **السيارة هي الأصل** وليس السائق.

### أ) المبدأ الأساسي: السيارة مصدر الدخل

|--------|--------|-------|----------|---------------------|
| FN-001 | حساب دخل المركبة | تتبع دخل كل سيارة حسب العقد المربوطة فيه + تجميع عند تنقلها بين عقود | عالية | "المحاسب يتابع بناءً على السيارة لأنها مصدر الدخل" |
| FN-002 | حساب مصاريف المركبة | تتبع كل مصاريف السيارة: صيانة + بنزين + تأمين + استهلاك | عالية | — |
| FN-003 | ربحية المركبة | دخل السيارة − مصاريفها = الربح الصافي لكل سيارة | عالية | "ربط المصاريف بالدخل لمعرفة الربح الفعلي" |

| FN-006 | قفل بيانات العقد | **بيانات العقد لا يمكن تغييرها بعد الإدخال** | عالية | ⚠️ "لمنع التلاعب من مدير أو محاسب" — أولوية قصوى |

| FU-002 | التوسع للتخزين والتوزيع | إضافة مراحل اللوجستيك الأخرى: تخزين → إعادة تعبئة → شحن → توزيع | مستقبلية | "مع إمكانية التوسع لاحقاً" |
| FU-003 | باقة متكاملة مع GPS | ربط المنتج مع شركة GPS التابعة للعميل (سيستم + GPS + حساسات) | مستقبلية | "العميل لديه شركة ثانية تبيع أجهزة GPS" |
| FU-004 | ميزة اتصال للأوبريتر | إمكانية اتصال مباشر من النظام لتسهيل الإدخال اليدوي | مستقبلية | — |
| FU-005 | ربط API مع شركات التوصيل | ربط مع داشبوردات شركات مثل يلا جو (إن أتيح) | مستقبلية | "99% يرفضون لأسباب أمنية" |
| FU-006 | حاسبة تكاليف للسوق | أداة لمساعدة شركات التوصيل بحساب تكاليفها الحقيقية | مستقبلية | "شركات كثيرة لا تحسب تكاليفها بدقة فتخسر وتسكر بعد سنتين" |

# PRD v2 — وثيقة متطلبات المنتج
# Product Requirements Document
# نظام إدارة أسطول التوصيل (FleetOps)

**إصدار الوثيقة:** 2.0  
**التاريخ:** 2026-03-08  
**المُعد:** **JoyBox**  
**العميل:** أبو حضرم (شركة لوجستيك — الكويت)  
**المرجع:** محضر اجتماع **JoyBox** مع العميل  
**الحضور في الاجتماع:** العميل (أبو حضرم) — مهندس عمرو — مهندس همام — المحاسب (أبو محمد) عبر الهاتف

---

## 1. الملخص التنفيذي (Executive Summary)

نظام ويب متكامل لإدارة عمليات شركة توصيل تعمل في مجال **اللوجستيك — مرحلة التوصيل الأخير (Last Mile Delivery)** في الكويت.

### سلسلة اللوجستيك الكاملة (للسياق):
```
تخزين (Warehousing) → إعادة تعبئة (Repacking) → شحن (Shipment) → توزيع (Dispatch) → توصيل أخير (Last Mile)
```
> **التركيز الحالي:** مرحلة Last Mile فقط — حيث تستلم شركة التوصيل الطلبات الجاهزة من شركة اللوجستيك وتوصلها للزبون النهائي.

### مثال عملي (من الاجتماع):
> مصنع يجهز بضاعة → شركة لوجستيك تأخذها وتعيد تغليفها → توزع الطلبات → **شركة التوصيل (Last Mile) توصل للزبون النهائي** ← هنا يعمل النظام

### النظام مصمم ليكون:
1. **مستقلاً**: يعمل بشكل مستقل تماماً عن أنظمة الشركات الأخرى (العميل لديه سيستم منافس حالي يعمل لكنه يريد سيستم خاص مستقل)
2. **قابلاً للبيع**: يُعاد بيعه كمنتج مستقل لشركات توصيل أخرى (Multi-Tenant مستقبلاً)
3. **قابلاً للتوسع**: يدعم التوسع من Last Mile ليشمل التخزين والتوزيع لاحقاً
4. **قابلاً للتكامل**: ربط مستقبلي مع شركة GPS تابعة للعميل (باقة متكاملة: سيستم + GPS + حساسات)

---

## 2. المشكلة (Problem Statement)

### 2.1 المشاكل الحالية (مستخلصة من الاجتماع)

| # | المشكلة | التأثير | اقتباس/سياق من الاجتماع |
|---|---------|---------|--------------------------|
| P1 | **التلاعب المالي** | أشخاص يغيرون أرقام الرواتب وقت الصرف، خسائر مالية مباشرة | "المشكلة الحالية: أشخاص يغيرون أرقام الرواتب وقت الصرف" |
| P2 | **الكاش بدون رقابة** | أموال العملاء عند السائقين بدون تتبع كافٍ | "الفلوس المعلقة خطيرة لأنها أمانة وليست ملك الشركة" |
| P3 | **غياب حساب التكاليف الحقيقية** | عدم معرفة الربح الفعلي: لا تُحسب تكاليف الاستهلاك والرسوم الحكومية والإيجارات | "شركات توصيل كثيرة لا تحسب تكاليفها بدقة فتخسر وتسكر بعد سنتين" |
| P4 | **بيانات مبعثرة** | البيانات موزعة بين واتساب وإكسل ونظام محاسبي منفصل | الهدف: "الاستغناء عن الإكسل والنظام المحاسبي الخارجي" |
| P5 | **تأخر الوثائق** | تأخير تجديد الوثائق يؤدي لغرامات حكومية باهظة | "غرامات عالية جداً على التأخير قد تُفلس الشركة" (خصوصاً الفحص الطبي) |
| P6 | **تلاعب بمصاريف الصيانة** | لا رقابة على تكاليف الصيانة وتضخيم الفواتير | "سوبرفايزر يراجع قيمة الصيانة لمنع التلاعب بالأسعار" |
| P7 | **الاعتماد على نظام منافس** | النظام الحالي ملك شركة أخرى — خطر استراتيجي | "العميل لديه سيستم منافس حالي يعمل لكنه يريد سيستم مستقل خاص به" |
| P8 | **صعوبة الإدخال** | السائقون غير متعلمين ومشغولون 12 ساعة، تطبيق الموبايل فشل | "تم تجربته سابقاً وفشل لأن السائقين غير متعلمين ومشغولين" |

### 2.2 التأثير المالي الكلي
- خسائر مالية مباشرة من التلاعب بالرواتب والمخالفات غير المحوّلة
- غرامات حكومية تصل لمبالغ قد تُفلس الشركة (خصوصاً الفحوصات الطبية)
- عدم قدرة صاحب العمل على معرفة التدفقات المالية الحقيقية المتوقعة
- خسارة شركات التوصيل وإغلاقها بعد سنتين بسبب سوء التسعير

## 3. الأهداف (Goals)

### 3.1 أهداف الأعمال (Business Goals)

| # | الهدف | مقياس النجاح | المشكلة المعالجة |
|---|-------|-------------|------------------|
| G1 | **منع التلاعب المالي** | صفر تعديل غير مصرح به على العقود والرواتب بعد الإدخال | P1, P6 |
| G2 | **رقابة كاملة على الكاش** | كل مبلغ معلق يمكن تتبعه بالتفصيل (سائق + سيارة + عقد + تاريخ) | P2 |
| G3 | **عدم تأخر أي وثيقة** | تنبيه قبل شهرين من انتهاء أي وثيقة (مركبات + أفراد) | P5 |
| G4 | **معرفة الربحية الفعلية** | تقرير دخل vs مصاريف لكل مركبة وعقد بشكل آلي | P3 |
| G5 | **استقلال النظام** | نظام مملوك بالكامل ولا يعتمد على أي نظام خارجي | P7 |
| G6 | **الاستغناء عن الإكسل** | كل الحسابات والتقارير من مصدر واحد | P4 |
| G7 | **قابلية البيع** | نظام جاهز للبيع لشركات توصيل أخرى | رؤية مستقبلية |
| G8 | **تحكم صاحب العمل الكامل** | صاحب البزنس يرى ويتحكم بكل التدفقات المالية | P1 |

### 3.2 أهداف المستخدم (User Goals)

| # | المستخدم | الهدف |
|---|----------|-------|
| U1 | صاحب العمل | يرى لوحة تحكم شاملة بنظرة واحدة — يعرف التدفقات المالية المتوقعة |
| U2 | الأوبريتر | يُدخل البيانات اليومية بسرعة وسهولة (بدون تعقيد — المستخدمين مستواهم التقني متوسط) |
| U3 | المحاسب | يستخرج كشوف الرواتب (رسمي + داخلي) بضغطة زر — بدون إمكانية تلاعب |
| U4 | السوبرفايزر | يراجع عروض الصيانة ويوافق/يرفض بشفافية |
| U5 | مدير العمليات | يتابع مراحل توظيف كل سائق + حالة الأسطول + المخالفات |

## 4. المستخدمون المستهدفون (User Personas)

### P1: صاحب العمل (أبو حضرم)
- **الدور**: مالك الشركة والمتحكم الأول في كل شيء
- **الاحتياج الأساسي**: رقابة كاملة على التدفقات المالية + منع التلاعب + معرفة الأرباح الحقيقية
- **أكبر مخاوفه**: التلاعب بالأرقام من الموظفين — يريد أن "يتحكم بكل شيء ويعرف التدفقات المالية المتوقعة"
- **مستوى تقني**: متوسط
- **استخدام النظام**: يومياً — لوحة التحكم والتقارير المالية

### P2: مدير العمليات (الأوبريتر)
- **الدور**: يدير العمليات اليومية + يوظف السائقين + يتابع الأسطول
- **الاحتياج الأساسي**: إدخال بيانات يومية بسرعة + تتبع مراحل التوظيف + متابعة المخالفات والحوادث
- **مستوى تقني**: متوسط
- **استخدام النظام**: يومياً — طوال اليوم
- **تحدٍّ خاص**: يلعب أدواراً متعددة (مندوب + أوبريشن + إداري)، قد يتأخر في الإدخال — لذلك مطلوب إمكانية **الإدخال بأثر رجعي**
- **ملاحظة**: يستقبل بيانات السائقين عبر واتساب أو يتحقق من داشبورد الشركة المتعاقدة

### P3: المحاسب (أبو محمد)
- **الدور**: يراقب الحسابات والتدفقات المالية — "السيارة هي الأصل" بالنسبة له
- **الاحتياج الأساسي**: حساب الرواتب تلقائياً + كشفين منفصلين (رسمي + داخلي) + منع تعديل الأرقام
- **منظوره المالي الفريد**: يتابع بناءً على السيارة (وليس السائق) لأنها مصدر الدخل
- **مستوى تقني**: متوسط
- **استخدام النظام**: أسبوعياً/شهرياً — كشوف رواتب + تقارير مالية
- **ملاحظة**: طلب نسخة تجريبية للاختبار + سيرسل تفاصيل مكتوبة أو صوتية إضافية

### P4: سوبرفايزر الصيانة
- **الدور**: يراجع عروض أسعار الصيانة ويوافق أو يرفض
- **الاحتياج الأساسي**: مراجعة الفواتير + مقارنة العروض + اتخاذ قرار سريع
- **أهمية الدور**: **منع التلاعب بأسعار الصيانة** — نقطة أكدها العميل
- **مستوى تقني**: متوسط
- **استخدام النظام**: حسب الحاجة

### P5: فني الصيانة
- **الدور**: يأخذ السيارة للكراج ويرفع الفواتير والصور
- **الاحتياج الأساسي**: رفع صور وفواتير بسهولة
- **مستوى تقني**: منخفض — يجب أن تكون الواجهة بسيطة جداً
- **استخدام النظام**: حسب الحاجة

> **ملاحظة مهمة**: لا يوجد Persona للسائق — السائقون لا يستخدمون النظام إطلاقاً. كل الإدخال يتم من طرف الأوبريتر.

## 5. نطاق المنتج (Product Scope)

### 5.1 ما يشمله النظام (In Scope)

| # | الوحدة | الوصف | السبب (من الاجتماع) |
|---|--------|-------|---------------------|
| 1 | **إدارة العمليات** | السجل اليومي، تتبع الكاش والعهدة، المخالفات، الحوادث | القلب التشغيلي — أول ما تحدث عنه العميل |
| 2 | **إدارة الصيانة** | دورة حياة كاملة: بلاغ → كراج → عرض سعر → موافقة → دفع | مطلوب موافقة السوبرفايزر لمنع التلاعب |
| 3 | **إدارة الأسطول** | تسجيل المركبات، 4 حالات، وثائق، مصاريف بنزين/زيت | "السيارة هي الأصل" — المحاسب |
| 4 | **الموارد البشرية** | تسجيل الموظفين، مراحل التوظيف (Overseas/داخلي)، الوثائق، الرواتب (مزدوجة: رسمي + داخلي)، نهاية الخدمة | نظام رواتب معقد بكشفين منفصلين |
| 5 | **العقود والعملاء** | إدارة العقود مع الشركات + قفل البيانات بعد الإدخال | "البيانات في العقد لا يمكن تغييرها بعد الإدخال" |
| 6 | **المالية** | دخل/مصاريف لكل مركبة، تدفقات مالية، مديونيات | "ربط المصاريف بالدخل لمعرفة الربح الفعلي" |
| 7 | **GPS (إدخال يدوي)** | إدخال كيلومترات يدوياً من سيستم GPS الخارجي | الإدخال يدوي حتى يتوفر API |
| 8 | **التقارير** | 7 أنواع تقارير تشغيلية ومالية محددة | مذكورة صراحة في الاجتماع |
| 9 | **التنبيهات** | تنبيهات وثائق (قبل شهرين) + صيانة (بالكيلومترات) + كاش (يومي) | فترات محددة للتنبيه |
| 10 | **المستخدمين والصلاحيات** | أدوار وصلاحيات + Audit Log + قفل بيانات حساسة | "النظام يجب أن يمنع التلاعب بالبيانات المالية" |

### 5.2 ما لا يشمله النظام (Out of Scope — المرحلة الأولى)

| # | الأمر | السبب (من الاجتماع) |
|---|-------|---------------------|
| 1 | **تطبيق موبايل للسائقين** | "تم تجربته سابقاً وفشل". الاعتماد حصرياً على **وكيل ذكاء اصطناعي للواتساب (AI WhatsApp Agent)** لإدخال أعداد الطلبات. |
| 2 | **ربط API مع شركات التوصيل** (يلا جو، كيتا) | "99% من الشركات ترفض لأسباب أمنية" |
| 3 | **التخزين والتوزيع** (Warehousing & Dispatch) | يُضاف لاحقاً عند التوسع |
| 4 | **ربط مباشر مع GPS عبر API** | يعتمد على توفر API مع مزود الخدمة — الإدخال اليدوي كعمل بديل |
| 5 | **Multi-Tenant / AI Isolation** | تصميم بنية SaaS مع عزل كامل لمعرفات WhatsApp ومفاتيح AI لكل عميل مستقبلي |
| 6 | **تحديث لحظي (Real-time)** | "السيستم لا يحتاج أن يكون Live بالثانية، نهاية اليوم كافية" |

## 6. المتطلبات الوظيفية عالية المستوى (High-Level Functional Requirements)

### 6.1 لوحة التحكم الرئيسية (Dashboard)
ما يراه صاحب العمل فور تسجيل الدخول:

| العنصر | الوصف | تفاعلي |
|--------|-------|--------|
| السائقون الفعالون | إجمالي عدد السائقين النشطين | ✅ قابل للضغط |
| حالة الأسطول | كم متاحة / تعمل / صيانة / واقفة | ✅ قابل للضغط |
| الطلبات اليومية | إجمالي الطلبات اليوم/الأسبوع | ✅ قابل للضغط |
| **الكاش المعلق** | إجمالي المبالغ المعلقة عند السائقين — **الضغط يعرض تفاصيل السائقين والسيارات** | ✅ أهم عنصر |
| مركبات بالصيانة | عدد السيارات في الصيانة حالياً | ✅ قابل للضغط |
| تنبيهات الوثائق | وثائق منتهية (🔴) + قريبة من الانتهاء (🟡) | ✅ قابل للضغط |
| أفضل 5 سائقين | ترتيب حسب عدد الطلبات الأسبوعية | — |

---

### 6.2 دورة حياة الطلب اليومي
```
                                  ┌─ مدفوع أونلاين (لا كاش)
السائق يستلم طلبات ← يوصّل →─────┤
                                  └─ كاش → يجمع الفلوس
                                            ↓
الأوبريتر يدخل السجل اليومي: سائق + عقد + عدد طلبات + كاش محصّل
(إدخال يدوي — واتساب أو داشبورد الشركة المتعاقدة)
(يمكن إدخال أيام سابقة — مرونة بالتأخير)
                                            ↓
النظام يحسب تلقائياً:
  • دخل العقد = عدد الطلبات × سعر الطلب بالعقد
  • راتب السائق (حسب نوع الحساب: ثابت / بالطلب / مختلط)
  • رصيد الكاش المعلق عند السائق
                                            ↓
نهاية اليوم: السائق يسلم الكاش ← الأوبريتر يعمل تسوية + تصوير إيصال ← إبراء ذمة
```

---

### 6.3 دورة حياة الصيانة
```
حادث/عطل → السائق يصوّر ويرسل للأوبريشن
                    ↓
الأوبريشن يرفع الصورة + يحوّل السيارة للصيانة (حالة المركبة ← "بالصيانة")
                    ↓
فني الصيانة يأخذ السيارة للكراج → يصوّر → يرفع الفاتورة/عرض السعر
                    ↓
سوبرفايزر يراجع القيمة:
  ├─ ✅ يوافق → الدفعة تُحوّل للمحاسبين → السيارة ترجع "متاحة"
  └─ ❌ يرفض (لمنع التلاعب بالأسعار) → يُطلب عرض بديل → يرجع للفني
                    ↓
تحديد المسؤولية:
  ├─ 90% من الحالات: على الشركة
  └─ إذا السائق متسبب: تُحسب كغرامة/خصم عليه
```

---

### 6.4 دورة حياة التوظيف

#### أ) Overseas (من الخارج) — حوالي شهرين:
```
موظف جديد يصل ← تسكين
        ↓
فحص طبي ← ⚠️ إلزامي — غرامات عالية جداً على التأخير
        ↓
إصدار إذن عمل
        ↓
فحص قيادة (Trial)
        ↓
الحصول على رخصة القيادة
        ↓
فترة تجربة 3 أشهر → فعّال أو غير فعّال
```
> **ملاحظة مهمة**: المراحل **ليست ثابتة الترتيب** — ممكن استثناءات وتسريع بعض الخطوات

#### ب) تحويل داخلي — يوم واحد:
```
موظف يعمل أصلاً بالكويت → عنده رخصة وفحص طبي ساري → يبدأ العمل خلال يوم
```

---

### 6.5 نظام الرواتب (مزدوج)

> هذا النظام فريد ومهم جداً — يجب فهمه بدقة:

```
┌───────────────────────────────────┐
│         الراتب الأساسي            │ ← مسجّل بوزارة الشؤون / إذن العمل
│      (مثال: 2 مليون ليرة)         │ ← يُدفع عبر البنك
│   = كشف رواتب رسمي (للبنك)       │
└───────────────────────────────────┘
                +
┌───────────────────────────────────┐
│       بونصات + بدلات إضافية       │ ← يُدفع كاش
│      (مثال: 2 مليون ليرة)         │
└───────────────────────────────────┘
                =
┌───────────────────────────────────┐
│     المبلغ الفعلي المدفوع        │
│      (مثال: 4 مليون ليرة)         │
│   = كشف رواتب داخلي (للداشبورد)  │
└───────────────────────────────────┘

السبب: حماية الشركة من مطالبات نهاية الخدمة على المبلغ الأعلى
```

#### أنواع دفع السائقين:
| النوع | الوصف | مثال |
|-------|-------|------|
| راتب ثابت | مبلغ شهري بغض النظر عن الطلبات | 300 دينار/شهر |
| على الطلب | مبلغ لكل طلب | 100 فلس/طلب |
| مختلط | الاثنين معاً في نفس العقد | 200 دينار + 50 فلس/طلب |

#### نهاية الخدمة:
- بعض الموظفين لهم حساب نهاية خدمة وبعضهم لا
- **Tick Box** عند التسجيل: "له نهاية خدمة" أم "لا"
- المبدأ: راتب أعلى بدون نهاية خدمة **أو** راتب أقل مع نهاية خدمة

---

### 6.6 نظام العقود (مقاوم للتلاعب)

```
┌─────────────────────────────────────────────────────────┐
│                        العقد                             │
├─────────────────────────────────────────────────────────┤
│ العميل: يلا جو / كيتا / إلخ                            │
│ نوع الحساب: بالطلب / راتب ثابت                          │
│ سعر الطلب: 1 دينار / 1.350 دينار (يختلف حسب العقد)     │
│ المدة: من تاريخ X إلى تاريخ Y                           │
├─────────────────────────────────────────────────────────┤
│ 🔒 القفل: بيانات العقد لا يمكن تغييرها بعد الإدخال      │
│    (لمنع التلاعب من مدير أو محاسب)                      │
│    → فقط صاحب العمل يمكنه تعديل عقد مقفل + Audit Log   │
└─────────────────────────────────────────────────────────┘
```

### 6.7 نظام البنزين (التزام بالبدل الثابت فقط)

| النموذج | الوصف | آلية العمل |
|---------|-------|-----------|
| **بدل ثابت** | الشركة تعطي السائق مبلغ ثابت للبنزين | مبلغ يُضاف للراتب وتسجل الفاتورة لتوثيق المصاريف |

- **إلغاء الميزانية المفتوحة**: تم إقرار إلغاء مفهوم "ميزانية البنزين" المفتوحة للقطاع هذا، والتمسك بمبدأ البدل الثابت.
- **التتبع**: السائق يصور فاتورة البنزين مع العداد
- **تغيير الزيت**: بحسب الكيلومترات (مثلاً كل 4000 كم) وليس الوقت — "لأن سيارات التوصيل تمشي كثيراً"

### 6.8 حساب الموظف (مدين / دائن)

سجل تراكمي لكل موظف:
```
(+) بونص طلبات
(+) بونص توفير بترول
(+) علاوات ومكافآت
─────────────────
(-) خصم مخالفات مرورية
(-) خصم غرامات
(-) خصم صيانة (إن كان متسبب)
═════════════════
= الإجمالي الصافي
```

## 7. متطلبات غير وظيفية (Non-Functional Requirements)

| # | المتطلب | التفصيل | المصدر |

| NFR-06 | **سهولة الاستخدام** | واجهة بسيطة حتى للمستخدمين ذوي المستوى التقني المنخفض (فني الصيانة) | — |
| NFR-07 | **اللغة** | دعم اللغة العربية (RTL) والإنجليزية | — |
| NFR-08 | **التوافق** | يعمل على متصفحات سطح المكتب والأجهزة اللوحية (Chrome, Edge, Safari) | — |
| NFR-09 | **قابلية التوسع** | بنية تسمح بإضافة وحدات (تخزين، توزيع) + Multi-tenant مستقبلاً | من الاجتماع |
| NFR-10 | **النسخ الاحتياطي** | نسخ احتياطي يومي تلقائي | — |
| NFR-11 | **المستخدمون المتزامنون** | 5-15 مستخدم كحد أقصى | — |

## 8. الافتراضات (Assumptions)

| # | الافتراض | المصدر |
|---|----------|--------|
| A1 | **الإدخال من الأوبريتر فقط** — وليس من السائقين مباشرة | "لا يوجد تطبيق للسائقين" |
| A2 | **لا يوجد تطبيق موبايل** للسائقين في أي مرحلة قريبة | فشل التجربة السابقة |
| A3 | **بيانات GPS تُدخل يدوياً** حتى يتوفر ربط API | الأوبريتر يفتح سيستم GPS الخارجي ويدخل الكيلومترات |
| A4 | **العملة الأساسية**: دينار كويتي | عمل الشركة بالكويت |
| A5 | **النظام ويب** (Web Application) وليس سطح المكتب | — |
| A6 | **نهاية اليوم كافية** — لا حاجة لتحديث لحظي | "السيستم لا يحتاج أن يكون Live بالثانية" |
| A7 | **ربط API مع شركات التوصيل غير ممكن** حالياً | "99% يرفضون لأسباب أمنية" |
| A8 | **المحاسب سيرسل تفاصيل إضافية** مكتوبة أو صوتية | من الاجتماع |
| A9 | **السيارة ممكن تنتقل بين عقود** مختلفة في نفس الشهر أو حتى نفس اليوم | المحاسب أكد ذلك |
| A10 | **السيارة ممكن يستخدمها أكثر من سائق** في نفس الشهر | المحاسب أكد ذلك |

## 9. القيود (Constraints)

| # | القيد | التأثير |
|---|-------|---------|
| C1 | المتطلبات ليست مكتملة 100% من البداية | يجب اعتماد منهجية مرنة (Spiral) |
| C2 | تفاصيل المحاسبة ليست واضحة بالكامل بعد | جلسة إضافية مع المحاسب مطلوبة |
| C3 | السائقون غير متعلمين ومشغولون | كل الإدخال من الأوبريتر فقط |
| C4 | العميل لديه سيستم منافس عامل حالياً | المقارنة ستكون حتمية |

## 10. المخاطر (Risks)

| # | الخطر | الاحتمال | التأثير | استراتيجية التخفيف |
|---|-------|---------|---------|-------------------|
| R1 | المتطلبات تتغير كثيراً أثناء التطوير | عالٍ | متوسط | منهجية Spiral + مراجعات دورية مع العميل |
| R2 | تفاصيل المحاسبة غير واضحة → حسابات خاطئة | متوسط | عالٍ | جلسة تفصيلية مع المحاسب + وثيقة مكتوبة منه + نسخة تجريبية للاختبار |
| R3 | ربط GPS غير مضمون تقنياً | متوسط | منخفض | الإدخال اليدوي كبديل دائم |
| R4 | مقاومة التغيير من المستخدمين | متوسط | متوسط | واجهة بسيطة + تدريب + إدخال يدوي بدون تطبيق سائقين |
| R5 | العميل يقارن بالسيستم المنافس الحالي | عالٍ | متوسط | فهم ميزات المنافس وتقديم قيمة مضافة واضحة |
| R6 | المحاسب بعيد (عبر الهاتف) وقد لا يوفر التفاصيل بالوقت | متوسط | عالٍ | تحديد مواعيد ثابتة + طلب وثائق مكتوبة |

## 12. الجدول الزمني المقترح (Timeline)

> المنهجية المتفق عليها: **Spiral (حلزوني)** — لأن المتطلبات ليست مكتملة 100% من البداية ونحتاج تعديلات مستمرة.

| المرحلة | الوصف | المدة المقترحة | الأولوية |
|---------|-------|---------------|---------|
| **المرحلة 1** | بناء النظام، العمليات، الصيانة، الموارد البشرية، والأسطول | 1.5 شهر | عالية |
| **المرحلة 2** | بدء الإدخال الميداني للسائقين والعمليات من قبل الأوبريشن | (ضمن الـ 1.5 شهر الأولى) | عالية |
| **المرحلة 3** | المالية، التقارير، قفل العقود، والتسليم النهائي | 1 شهر إضافي | عالية |
| **الإجمالي** | | **2.5 شهر كامل** | |

> **ملاحظة**: تم تعديل الجدول الزمني لتنفيذ واقعي مدته شهرين ونصف: شهر ونصف للإطلاق الأولي وتعبئة البيانات التشغيلية، وشهر أخير للإكمال والتسليم النهائي.

> **ملاحظة**: المحاسب (أبو محمد) طلب نسخة تجريبية للاختبار والتعديلات — يجب تخصيص وقت كافٍ للمرحلة 6.

## 14. ملاحظة حول المنهجية

> **هام**: اتُفق في الاجتماع على استخدام منهجية **Spiral (حلزوني)** وليس Waterfall (شلال).

# SRS v2 — مواصفات متطلبات البرمجيات
# Software Requirements Specification
# نظام إدارة أسطول التوصيل (FleetOps)

**إصدار الوثيقة:** 2.0  
**التاريخ:** 2026-03-08  
**المرجع:** محضر اجتماع **JoyBox** مع العميل + Feature List v2 + PRD v2

---

## 1. المقدمة

### 1.1 الغرض
تحديد المتطلبات الوظيفية وغير الوظيفية لنظام FleetOps بشكل تفصيلي يكفي لبدء التطوير. هذه الوثيقة تُستخدم كمرجع أساسي ل**JoyBox**.

### 1.2 النطاق
نظام ويب لإدارة عمليات Last Mile Delivery يشمل: العمليات، الصيانة، الأسطول، الموارد البشرية، العقود، المالية، GPS، التقارير، التنبيهات، وإدارة المستخدمين.

### 1.3 المصطلحات

| المصطلح | التعريف |
|---------|---------|
| Last Mile | المرحلة الأخيرة من سلسلة التوصيل: إيصال الطلب للعميل النهائي |
| أوبريتر (Operator) | الموظف المسؤول عن إدخال البيانات اليومية في النظام |
| العهدة | المبالغ النقدية (كاش) التي يجمعها السائق من العملاء ويجب تسليمها |
| إبراء الذمة | تأكيد تسليم السائق لجميع المبالغ المعلقة عنده |
| Overseas | موظف قادم من خارج الكويت ويحتاج لمراحل توظيف كاملة (~شهرين) |
| تحويل داخلي | موظف يعمل أصلاً بالكويت وينتقل للشركة (يوم واحد فقط) |
| Odometer | عداد المسافة في السيارة |
| كشف رسمي | كشف رواتب بالراتب الأساسي فقط (لوزارة الشؤون / البنك) |
| كشف داخلي | كشف رواتب بكل المدفوعات الفعلية (للداشبورد الداخلي) |
| بدل بنزين ثابت | مبلغ ثابت يتم توثيقه وتتبعه عبر نظام الفواتير بدلاً من الميزانيات المفتوحة |

نظام ويب مستقل (Standalone Web Application) يعمل على المتصفح. لا يعتمد على أنظمة خارجية. قابل للتوسع عبر API لاحقاً. مصمم ليكون قابلاً للبيع لشركات أخرى مستقبلاً.

### 2.3 بيئة التشغيل

## 3. المتطلبات الوظيفية التفصيلية

---

### 3.1 إدارة العمليات (OP)

#### FR-OP-001: السجل اليومي للطلبات
- **المدخلات**: التاريخ (اليوم أو سابق)، اسم السائق، العقد/الشركة، عدد الطلبات، مبلغ الكاش المحصّل
- **القواعد**:
  - يمكن إدخال تاريخ سابق (بأثر رجعي) — تحذير إذا أكثر من أسبوع لكن يسمح
  - سائق واحد يمكن أن يكون له إدخالات في عقود مختلفة في نفس اليوم
  - كاش = 0 مسموح (طلبات مدفوعة أونلاين بالكامل)
  - البيانات تُحفظ فوراً وتنعكس على: تقرير الطلبات + الكاش المعلق + حساب الراتب + دخل العقد
- **ملاحظة**: لا يوجد تطبيق للسائقين — الأوبريتر يدخل البيانات من واتساب أو داشبورد الشركة المتعاقدة

#### FR-OP-002: تتبع الكاش المعلق
- **المعالجة**: مجموع الكاش المدخل − مجموع التسويات = الكاش المعلق
- **العرض في لوحة التحكم**: الإجمالي (رقم كبير واضح)
- **الضغط يعرض التفاصيل**: لكل سائق: المبلغ المعلق + السيارة + العقد + التاريخ
- **⚠️ أهمية**: "الفلوس المعلقة خطيرة لأنها أمانة وليست ملك الشركة"

#### FR-OP-003: تسليم العهدة (تسوية الكاش + إبراء ذمة)
- **المدخلات**: السائق، المبلغ المسلّم، تاريخ التسليم، **صورة إيصال التسليم** (إلزامي)
- **القواعد**:
  - المبلغ يُخصم من رصيد الكاش المعلق
  - يمكن تسليم جزئي (الرصيد المتبقي يبقى معلقاً)
  - المبلغ لا يمكن أن يتجاوز المعلق (خطأ)
  - إبراء ذمة كامل عندما يصل الرصيد لصفر

#### FR-OP-004: تسجيل مخالفة مرورية
- **المدخلات**: السائق، المركبة، رقم المخالفة، القيمة، التاريخ، الموقع، نوع المخالفة
- **المخرجات**: 
  - المخالفة تُضاف لسجل السائق (مدين/دائن) كخصم
  - الخصم يظهر في كشف الراتب الداخلي تلقائياً وقت الصرف
- **ملاحظة**: الأوبريتر يسجل المخالفة **فوراً** — السيارات مسجلة باسم الشركة
- **إثبات**: مطلوب إثبات مسجل للسائق ليطمئن (يمكنه الاطلاع على نسخة)

#### FR-OP-005: الإبلاغ عن حادث
- **المدخلات**: السائق، المركبة، وصف الحادث، صور (متعددة)، التاريخ، الموقع
- **المخرجات**:
  - يُسجّل بلاغ الحادث مع كافة الصور والتفاصيل
  - **تحويل السيارة للصيانة اختياري** (ليس إلزامياً) — حسب طبيعة الحادث
  - في حال التحويل: يُنشأ طلب صيانة تلقائياً ويُحوّل لقسم الصيانة

#### FR-OP-006: مصاريف البنزين (محدّث)
- **نموذج بدل ثابت فقط**: مبلغ يُسجّل ويُضاف للراتب مباشرة
- **~~نموذج البودجت~~**: (**تم إلغاؤه** صراحة في أحدث التعديلات)
- **تسجيل تعبئة**: المبلغ + صورة فاتورة البنزين + قراءة عداد السيارة (صورة العداد)

### 3.2 إدارة الصيانة (MN)

#### FR-MN-001: دورة حياة طلب الصيانة

**الحالات والتحويلات:**
```
جديد (New) ← يُنشأ من الأوبريشن أو تلقائياً من بلاغ حادث
    ↓
قيد المراجعة (Pending Review) ← الفني يأخذ السيارة للكراج ويصور ويرفع عرض السعر
    ↓
بانتظار الموافقة (Awaiting Approval) ← السوبرفايزر يراجع
    ↓ (موافقة)                    ↓ (رفض — لمنع التلاعب بالأسعار)
معتمد (Approved)           مرفوض (Rejected) → يُطلب عرض بديل → قيد المراجعة
    ↓
جاري الإصلاح (In Progress)
    ↓
مكتمل (Completed) ← الفاتورة تُحوّل للمحاسبين ← السيارة ترجع "متاحة"
```

#### FR-MN-002: رفع عرض سعر
- **المدخلات**: وصف المشكلة، صور الضرر، اسم الكراج، قيمة العرض، مرفق الفاتورة
- **الشرط**: فني الصيانة فقط يمكنه الرفع

#### FR-MN-003: موافقة/رفض السوبرفايزر
- **عند الموافقة**: الفاتورة تُحوّل تلقائياً لقسم المحاسبة — "بعد الموافقة تمشي الدفعات مع المحاسبين"
- **عند الرفض**: سبب الرفض + يمكن طلب عرض من كراج آخر
- **⚠️ الهدف**: "منع التلاعب بالأسعار"

#### FR-MN-004: تحميل الصيانة على السائق
- **90% من الحالات**: على حساب الشركة
- **إذا السائق متسبب**: تُحسب كغرامة/خصم على سجل السائق (مدين/دائن)
- **القرار**: يتخذه السوبرفايزر أو مدير العمليات

### 3.3 إدارة الأسطول (FL)

#### FR-FL-001: تسجيل مركبة جديدة
- **المدخلات**: رقم اللوحة، النوع، الموديل، سنة الصنع، اللون، رقم الشاسيه، صورة
- **المخرجات**: سجل مركبة بحالة "متاحة" تلقائياً
- **القواعد**: رقم اللوحة فريد، جميع الحقول الأساسية إلزامية

#### FR-FL-002: حالات المركبة (4 حالات)
| الحالة | الوصف | التحويلات المسموحة |
|--------|-------|-------------------|
| `متاحة` (Available) | باركنج — جاهزة للعمل | → تعمل / بالصيانة / واقفة |
| `تعمل` (Active) | على الطريق مع سائق | → متاحة / بالصيانة |
| `بالصيانة` (In Maintenance) | محوّلة لقسم الصيانة | → متاحة |
| `واقفة` (Idle) | لا يوجد عمل / لم تُعيّن | → متاحة / بالصيانة |

- **ملاحظة مهمة**: التفريق بين "متاحة" (جاهزة للعمل) و"واقفة" (لا شغل) مهم تشغيلياً

#### FR-FL-003: تعيين سائق لمركبة
- **القواعد**:
  - سائق واحد فعّال على المركبة في وقت معين
  - "السيارة الواحدة ممكن يستخدمها أكثر من سائق في نفس الشهر"
  - عند تغيير السائق: التاريخ السابق يُغلق تلقائياً
  - يُحفظ سجل تاريخي كامل

#### FR-FL-004: تعيين مركبة لعقد
- **القواعد**:
  - "السيارة ممكن تنتقل بين عقود مختلفة في نفس الشهر أو حتى نفس اليوم"
  - عند النقل: النظام يحسب الدخل لكل فترة بناءً على سعر عقدها
  - سجل تاريخي لكل مركبة مع أي عقد عملت

#### FR-FL-005: وثائق المركبة (ديناميكية)
- **الأنواع**: ديناميكية ومفتوحة — تشمل حالياً: تأمين عادي، تأمين شامل، رخصة هيئة الغذاء، مواعيد الصيانة الدورية، ويمكن إضافة أنواع مستقبلية
- **لكل وثيقة**: رقم، تاريخ إصدار، تاريخ انتهاء، ملف مرفق
- **التصنيف التلقائي**: ساري (🟢) / قريب الانتهاء (🟡) / منتهي (🔴)
- **التنبيه**: قبل شهرين من الانتهاء

#### FR-FL-006: مصاريف البنزين (محدّث)
- **نموذج البدل الثابت فقط**: مبلغ يُسجّل ويُضاف للراتب
- **~~نموذج البودجت~~**: (**تم إلغاؤه**)
- **تسجيل التعبئة**: المبلغ + صورة الفاتورة + قراءة عداد السيارة

#### FR-FL-007: سجل الكيلومترات والصيانة الدورية
- **الإدخال**: يدوي من الأوبريتر (من سيستم GPS الخارجي)
- **القراءة الجديدة** يجب أن تكون أكبر من السابقة
- **تغيير الزيت**: بحسب الكيلومترات (مثلاً كل 4000 كم) وليس الوقت
- **تنبيه**: قبل أسبوع من الموعد المتوقع بناءً على معدل القيادة

### 3.4 إدارة الموارد البشرية (HR)

#### FR-HR-001: تسجيل موظف جديد
- **المدخلات**: الاسم، الجنسية، رقم الهوية/الجواز، تاريخ الميلاد، الهاتف، صورة، العنوان، نوع الانضمام (Overseas / تحويل داخلي)
- **المخرجات**: 
  - Overseas → حالة "قيد الإجراء" مع بدء مراحل التوظيف
  - تحويل داخلي → حالة "فعّال" مباشرة (يوم واحد فقط — عنده رخصة وفحص ساري)

#### FR-HR-002: مراحل التوظيف (Overseas)
- **المراحل**:
  1. `وصل` (Arrived)
  2. `تم التسكين` (Housed)
  3. `فحص طبي` (Medical) — ⚠️ **غرامات عالية جداً على التأخير قد تُفلس الشركة**
  4. `إذن عمل` (Work Permit)
  5. `فحص قيادة` (Driving Test — Trial)
  6. `رخصة قيادة` (License Issued)
  7. `جاهز للعمل` (Ready)
- **القواعد الحاسمة**:
  - المراحل **ليست ثابتة الترتيب** — يمكن تقديم/تأخير أي مرحلة
  - كل مرحلة بتاريخ بدء وانتهاء
  - لكل مرحلة حالات: لم تبدأ / مُجدوَل / اجتاز / لم يجتز / صادر
  - الفترة الكاملة: حوالي شهرين

#### FR-HR-003: وثائق الموظف
- **الأنواع**: كرت صحي (سنوي — إلزامي لتوصيل الأكل)، إقامة (سنوية)، رخصة قيادة، إذن عمل
- **لكل وثيقة**: رقم، تاريخ إصدار، تاريخ انتهاء، مرفق
- **التنبيه**: قبل شهرين من الانتهاء

#### FR-HR-004: حالات الموظف
| الحالة | الوصف | يظهر بالرواتب | يظهر بالتقارير |
|--------|-------|--------------|---------------|
| `قيد الإجراء` (Onboarding) | Overseas جديد | ❌ | ✅ |
| `فعّال` (Active) | يعمل حالياً | ✅ | ✅ |
| `إجازة` (On Leave) | متوقف مؤقتاً — سيعود | ❌ | ✅ |
| `غير فعّال` (Inactive) | ترك/استقال/فُصل | ❌ | ✅ |
| `تسوية موظف` (Clearance) | إخراج رسمي من التوظيف — تسوية نهائية | ❌ | ✅ |

- **"إجازة مختلف عن غير فعال"** — مؤكد من الاجتماع
- كل تغيير حالة يُسجّل مع السبب
- يمكن إعادة تفعيل موظف غير فعّال
- **فترة التجربة**: 3 أشهر — ممكن يمشي بعد شهر أو شهرين → يتحول لـ "غير فعال"

#### FR-HR-005: إعداد الراتب
- **المدخلات**:
  - الراتب الأساسي (المسجل بوزارة الشؤون / إذن العمل) — يُدفع عبر البنك
  - نوع الحساب: ثابت / على الطلب / مختلط
  - سعر الطلب (إن كان على الطلب)
  - نوع بدل البنزين: ثابت فقط (~~بودجت ملغى~~)
  - هل يستحق نهاية خدمة: نعم / لا (Tick Box)
- **القواعد**: الراتب الأساسي لا يُعدّل إلا بصلاحية مدير عام

#### FR-HR-006: حساب الراتب الشهري التلقائي
- **المعالجة**:
  - ثابت: الراتب كما هو
  - على الطلب: عدد الطلبات × سعر الطلب
  - مختلط: الراتب الأساسي + (عدد الطلبات × سعر الطلب)
- **الإضافات**: + بونص طلبات + بونص توفير بترول + علاوات ومكافآت
- **الخصومات**: - مخالفات مرورية - غرامات - صيانة (إن متسبب) - سلف
- **المخرجات**:
  - **كشف رسمي** = الراتب الأساسي فقط (للبنك/وزارة الشؤون)
  - **كشف داخلي** = كل شيء محسوب (الراتب الفعلي الكامل)
- **⚠️ منع التلاعب**: "أشخاص يغيرون أرقام الرواتب وقت الصرف" — الأرقام المحسوبة لا تُعدّل يدوياً

#### FR-HR-007: كشف الرواتب (مزدوج)
- **كشف رسمي**: الراتب المسجل في إذن العمل لكل موظف فعّال — للبنك/وزارة الشؤون
- **كشف داخلي**: أساسي + بونص + بدلات - خصومات = صافي — للداشبورد
- **القواعد**:
  - لا يظهر: غير الفعّال + الإجازة
  - يمكن تصدير الكشف الرسمي بصيغة ملف بنكي (Excel/CSV)
  - **لا يمكن للمحاسب تعديل الأرقام المحسوبة** — يتواصل مع المدير العام إذا كان هناك خطأ

### 3.5 إدارة العقود والعملاء (CT)

#### FR-CT-001: تسجيل عميل
- **المدخلات**: اسم الشركة، جهة الاتصال، الهاتف، البريد، العنوان

#### FR-CT-002: إنشاء عقد
- **المدخلات**:
  - اسم العميل/الشركة
  - نوع الحساب: بالطلب (Per Order) / بالراتب (Fixed) / مختلط
  - سعر الطلب إن كان بالطلب (مثلاً: عقد A = 1 دينار، عقد B = 1.350 دينار)
  - تاريخ بدء + انتهاء
  - شروط إضافية (اختياري)
- **🔒 القفل**: بيانات العقد **تُقفل بعد الحفظ** ولا يمكن تعديلها
  - "لمنع التلاعب من مدير أو محاسب"
  - فقط المدير العام يمكنه تعديل عقد مقفل + سبب + Audit Log

#### FR-CT-003: حساب الدخل التلقائي
- عقد بالطلب: الدخل = عدد الطلبات × سعر الطلب
- إذا انتقلت مركبة بين عقدين: كل فترة تُحسب بسعر عقدها

#### FR-CT-004: حساب راتب السائق التلقائي
- سائق بالراتب: يأخذ راتبه الثابت بغض النظر عن الطلبات
- سائق بالطلب: راتبه = عدد طلباته × سعر الطلب
- **⚠️ القيد**: "النظام يحسب الراتب تلقائياً ولا يمكن لأحد تعديله يدوياً"

---

### 3.6 الإدارة المالية (FN)

#### FR-FN-001: مبدأ "السيارة هي الأصل"
- **"المحاسب يتابع بناءً على السيارة لأنها مصدر الدخل"**
- كل مركبة لها: دخل (من العقد) + مصاريف (صيانة + بنزين + تأمين + استهلاك)
- ربحية المركبة = الدخل − المصاريف

#### FR-FN-002: سجل مدين/دائن للسائق
- (+) راتب أساسي + بونص طلبات + بونص توفير بنزين + علاوات ومكافآت
- (-) مخالفات مرورية + غرامات (حوادث، صيانة) + سلف
- (=) صافي المستحق
- كل حركة مسجّلة بالتاريخ والسبب (تاريخي تراكمي)

#### FR-FN-003: حسابات المديونيات
- تسجيل شراء/تأجير سيارات من مورد + جدول أقساط
- تتبع الدفعات المسددة والمتبقية
- ربط المديونية بالمركبة المعنية

#### FR-FN-004: التدفقات المالية
- ملخص شهري لصاحب العمل:
  - إجمالي الدخل من كل العقود
  - إجمالي المصاريف (رواتب + صيانة + بنزين + تأمين + إيجارات)
  - صافي الربح/الخسارة
- بالتفصيل: دخل ومصاريف كل مركبة / كل عقد
- **الهدف**: "الاستغناء عن الإكسل والنظام المحاسبي الخارجي"

---

### 3.7 GPS (إدخال يدوي حالياً)

#### FR-GPS-001: إدخال كيلومترات يدوي
- الأوبريتر يفتح سيستم GPS الخارجي ويدخل القراءة في FleetOps
- القراءة الجديدة > السابقة (تحقق)

#### FR-GPS-002: ربط API (مستقبلي)
- إذا توفر API من مزود GPS → سحب تلقائي للموقع والمسافة
- العميل لديه شركة ثانية تبيع أجهزة GPS — فرصة للتكامل

### 3.9 التنبيهات (NT)

#### FR-NT-001: محرك التنبيهات
| نوع التنبيه | الفترة | المثال |
|------------|--------|--------|
| وثائق رسمية (مركبات + أفراد) | **قبل شهرين** | تأمين، إقامة، كرت صحي |
| صيانة دورية (زيت) | **قبل أسبوع** من الموعد المتوقع بناءً على الكيلومترات | كل 4000 كم |
| كاش معلق | **يومي** | أي مبلغ غير مسلّم |
| فحص طبي (Overseas) | **عاجل** — غرامات عالية | ⚠️ أولوية قصوى |

#### FR-NT-002: نظام الألوان
- 🔴 **أحمر**: منتهي أو متأخر
- 🟡 **أصفر**: قريب الانتهاء (حسب الإعدادات)
- 🟢 **أخضر**: ساري

#### FR-NT-003: لوحة تنبيهات مركزية
- صفحة مركزية تعرض جميع التنبيهات مصنفة بالألوان
- أيقونة إشعارات في الهيدر مع عدد غير المقروءة
- الضغط على التنبيه → ينقل لصفحة العنصر المعني

#### FR-NT-004: إعدادات التنبيهات
- إعدادات **موحّدة** لفترات التنبيه حسب نوع الوثيقة
- لا يُعدّل لكل وثيقة فردياً

---

### 3.10 إدارة المستخدمين (US)

#### FR-US-001: سجل التدقيق (Audit Log)
- **يُسجّل لكل عملية**: من (المستخدم) + متى (التاريخ والوقت) + ماذا (العملية) + القيمة القديمة + القيمة الجديدة
- **لا يمكن حذفه أو تعديله** من أي مستخدم — حتى المدير العام
- فلاتر: حسب المستخدم، التاريخ، نوع العملية

#### FR-US-002: قفل البيانات الحساسة
- العقود: تُقفل بعد الحفظ — تعديل فقط بصلاحية مدير عام + سبب
- الرواتب المحسوبة: لا تُعدّل يدوياً
- **"النظام يجب أن يمنع التلاعب بالبيانات المالية"**

---

## 4. المتطلبات غير الوظيفية

### 4.1 الأداء
| المتطلب | القيمة |
|---------|--------|
| زمن تحميل الصفحة | < 3 ثوانٍ |
| زمن استجابة API | < 1 ثانية |
| حجم رفع الملفات | حتى 10 ميغابايت/ملف |
| المستخدمون المتزامنون | حتى 15 |

### 4.2 الأمان
- HTTPS إلزامي
- كلمات مرور مشفرة (bcrypt)
- صلاحيات مبنية على الأدوار (RBAC)
- جلسة تنتهي بعد 30 دقيقة عدم نشاط
- Audit Log غير قابل للحذف
- بيانات العقود والرواتب مقفلة

### 4.3 الموثوقية
- نسخ احتياطي يومي تلقائي
- استعادة البيانات خلال ساعة
- وقت تشغيل مستهدف: 99.5%

### 4.4 سهولة الاستخدام
- واجهة عربية (RTL) مع دعم إنجليزية
- لا يحتاج المستخدم لتدريب أكثر من ساعة
- رسائل خطأ واضحة ومفهومة

### 4.5 قابلية التوسع
- بنية تدعم إضافة وحدات (تخزين، توزيع)
- دعم Multi-tenant مستقبلاً
- API مفتوح للربط مع GPS أو أنظمة خارجية

## UC-01: إدخال السجل اليومي للطلبات

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-01 |
| **العنوان** | إدخال بيانات الطلبات والكاش اليومية لسائق |
| **الفاعل الرئيسي** | أوبريتر / مدير العمليات |
| **الشرط المسبق** | السائق فعّال ومربوط بعقد |
| **الشرط اللاحق** | البيانات محفوظة وتنعكس على: تقرير الطلبات + الكاش المعلق + حساب الراتب + دخل العقد |

**السيناريو الرئيسي:**
1. الأوبريتر يفتح صفحة "السجل اليومي"
2. يختار التاريخ (اليوم أو تاريخ سابق — إدخال بأثر رجعي مسموح)
3. يختار السائق من القائمة
4. النظام يعرض العقد/العقود المربوط بها السائق حالياً
5. الأوبريتر يختار العقد المحدد (السائق/السيارة ممكن تنتقل بين عقود بنفس اليوم)
6. يُدخل: عدد الطلبات + مبلغ الكاش المحصّل
7. يضغط "حفظ"
8. النظام يحفظ ويُحدّث تلقائياً:
   - رصيد الكاش المعلق للسائق
   - عداد الطلبات الأسبوعي
   - حساب دخل العقد (عدد الطلبات × سعر الطلب)
   - حساب راتب السائق (حسب نوع الدفع)

**السيناريوهات البديلة:**
- **2أ**: تاريخ سابق بأكثر من أسبوع → تحذير لكن يسمح بالإدخال
- **6أ**: الكاش = 0 → الطلبات كلها مدفوعة أونلاين (مسموح)
- **5أ**: السائق يعمل على عقدين في نفس اليوم → يُدخل سجل لكل عقد على حدة

> **ملاحظة**: الأوبريتر يستقبل البيانات عبر واتساب من السائق أو يتحقق من داشبورد الشركة المتعاقدة. لا يوجد تطبيق للسائقين.

---

## UC-02: تسوية الكاش (تسليم العهدة + إبراء الذمة)

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-02 |
| **العنوان** | تسجيل تسليم السائق للمبالغ النقدية المعلقة |
| **الفاعل الرئيسي** | أوبريتر / مدير العمليات |
| **الشرط المسبق** | السائق لديه كاش معلق > 0 |
| **الشرط اللاحق** | الكاش المعلق ينخفض + إبراء ذمة إذا وصل صفر |

**السيناريو الرئيسي:**
1. الأوبريتر يفتح صفحة "الكاش المعلق"
2. يرى قائمة السائقين مع المبالغ المعلقة عند كل واحد
3. يضغط على سائق معيّن
4. النظام يعرض تفاصيل: لكل إدخال → التاريخ + العقد + السيارة + المبلغ
5. الأوبريتر يُدخل المبلغ المسلّم
6. يرفع **صورة إيصال التسليم** (إلزامي)
7. يضغط "تسوية"
8. النظام يخصم المبلغ من الكاش المعلق
9. إذا وصل الرصيد لصفر → "تم إبراء الذمة" ✅

**السيناريوهات البديلة:**
- **5أ**: تسليم جزئي → الرصيد المتبقي يبقى معلقاً
- **5ب**: المبلغ أكبر من المعلق → يمنع العملية + رسالة خطأ

> **⚠️ من الاجتماع**: "الفلوس المعلقة خطيرة لأنها أمانة وليست ملك الشركة" — يجب لوحة تحكم تعرض المبالغ المعلقة بوضوح.

## UC-03: تسجيل مخالفة مرورية

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-03 |
| **العنوان** | تسجيل مخالفة مرورية على سائق |
| **الفاعل الرئيسي** | أوبريتر |
| **الشرط المسبق** | السائق والمركبة مسجلان — السيارات مسجلة باسم الشركة |
| **الشرط اللاحق** | المخالفة مسجّلة + مبلغها مضاف كخصم على سجل السائق |

**السيناريو الرئيسي:**
1. الأوبريتر يسجل المخالفة **فوراً** عند وصولها
2. يختار السائق المسؤول والمركبة
3. يُدخل: رقم المخالفة، القيمة، التاريخ، الموقع، النوع
4. يضغط "حفظ"
5. النظام يحفظ المخالفة مع **إثبات مسجل يمكن للسائق الاطلاع عليه**
6. النظام يُضيف قيد خصم تلقائياً في سجل السائق (مدين/دائن)
7. الخصم يظهر في كشف الراتب الداخلي وقت الصرف

> **من الاجتماع**: "مطلوب إثبات مسجل للسائق ليطمئن"

## UC-04: الإبلاغ عن حادث + تحويل للصيانة

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-04 |
| **العنوان** | تسجيل حادث وتحويل السيارة للصيانة (اختياري) |
| **الفاعل الرئيسي** | أوبريتر / مدير العمليات |
| **الشرط المسبق** | المركبة مسجّلة في النظام |
| **الشرط اللاحق** | بلاغ حادث محفوظ + حالة المركبة = "بالصيانة" + طلب صيانة جديد |

**السيناريو الرئيسي:**
1. السائق يصوّر الحادث ويرسل للأوبريشن (عبر واتساب)
2. الأوبريتر يُنشئ بلاغ حادث: يختار السائق + المركبة + يكتب الوصف
3. يرفع الصور المتعددة
4. يضغط "حفظ"
5. النظام تلقائياً:
   - يغيّر حالة المركبة لـ **"بالصيانة"**
   - يُنشئ طلب صيانة جديد مع الصور والتفاصيل
   - يُحوّل للفني

---

## UC-05: دورة الصيانة الكاملة (متعدد الفاعلين)

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-05 |
| **العنوان** | إدارة دورة صيانة مركبة من البلاغ حتى الإكمال |
| **الفاعلون** | أوبريتر (يُبلغ) → فني صيانة (يرفع عرض) → سوبرفايزر (يوافق) → محاسب (يدفع) |
| **الشرط المسبق** | المركبة بحاجة لصيانة (حادث أو عطل) |
| **الشرط اللاحق** | المركبة ترجع "متاحة" + الفاتورة مسددة |

**السيناريو الرئيسي:**
1. **الأوبريتر** يُنشئ بلاغ (أو يُنشأ تلقائياً من UC-04)
2. النظام يغيّر حالة المركبة لـ "بالصيانة" + يُنشئ طلب صيانة
3. **فني الصيانة** يأخذ السيارة للكراج ويصوّر الحالة
4. الفني يرفع عرض سعر: اسم الكراج + القيمة + وصف المشكلة + صورة الفاتورة
5. النظام يغيّر حالة الطلب لـ "بانتظار الموافقة"
6. **سوبرفايزر الصيانة** يراجع العرض
7. السوبرفايزر **يوافق** (لمنع التلاعب بالأسعار)
8. النظام يغيّر حالة الطلب لـ "معتمد" → "جاري الإصلاح"
9. عند الانتهاء: الفني يُؤكد الإكمال
10. النظام: حالة الطلب ← "مكتمل" + المركبة ← "متاحة"
11. الفاتورة تُحوّل للمحاسبين للدفع

**السيناريوهات البديلة:**
- **7أ**: السوبرفايزر **يرفض** → يكتب سبب → يُطلب عرض من كراج آخر → نعود لخطوة 4
- **11أ**: السائق متسبب بالحادث → تحميل الصيانة كخصم/غرامة على سجل السائق
- **ملاحظة**: "الصيانة 90% على حساب الشركة، إلا إذا السائق متسبب"

## UC-06: تسجيل مركبة جديدة

| البند | التفصيل |

| **الرمز** | UC-06 |
| **الفاعل الرئيسي** | مدير العمليات |
| **الشرط اللاحق** | المركبة مسجّلة بحالة "متاحة" وتظهر في لوحة الأسطول |

**السيناريو الرئيسي:**
1. يفتح "إدارة الأسطول" → "إضافة مركبة"
2. يُدخل: رقم اللوحة، النوع، الموديل، السنة، اللون، رقم الشاسيه
3. يرفع صورة المركبة (اختياري)
4. يضغط "حفظ"
5. النظام يتحقق من فرادة رقم اللوحة + الحقول الإلزامية
6. يحفظ بحالة "متاحة"

**البديل:** رقم اللوحة مكرر → خطأ "رقم اللوحة موجود مسبقاً"

## UC-07: نقل مركبة بين عقود

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-07 |
| **الفاعل الرئيسي** | مدير العمليات |
| **الشرط المسبق** | المركبة مربوطة بعقد حالي + العقد الجديد موجود |
| **الشرط اللاحق** | المركبة بالعقد الجديد + حسابات منفصلة لكل فترة |

**السيناريو الرئيسي:**
1. يفتح صفحة المركبة → "نقل لعقد آخر"
2. يختار العقد الجديد
3. يُحدد تاريخ النقل
4. النظام يُغلق فترة العقد القديم بتاريخ النقل
5. يفتح فترة جديدة بالعقد الجديد
6. كل فترة تُحسب بسعر عقدها

> **من الاجتماع**: "السيارة ممكن تنتقل بين عقود مختلفة في نفس الشهر أو حتى نفس اليوم"

## UC-08: إثبات فاتورة تعبئة بنزين (بدل ثابت)

4. يرفع **صورة فاتورة البنزين مع عداد السيارة**
5. يضغط "حفظ"
6. النظام يسجل التعبئة في سجل المركبة
7. تدوين الفاتورة كجزء من المصاريف الثابتة للمركبة

> **ملاحظة**: تم إلغاء البودجت بالكامل لصالح نظام البدل الثابت لتبسيط المحاسبة وحصر النفقات.

## UC-10: تحديث مراحل التوظيف (Overseas)

| البند | التفصيل |

| **الرمز** | UC-10 |
| **الفاعل الرئيسي** | مدير العمليات |

| **الشرط اللاحق** | المرحلة محدّثة |

**السيناريو الرئيسي:**
1. يفتح صفحة الموظف → يرى قائمة المراحل
2. يختار **أي مرحلة** (الترتيب **غير إلزامي** — ممكن استثناءات وتسريع)
3. يُحدّث الحالة: مُجدوَل / اجتاز / لم يجتز / صادر
4. يُدخل التواريخ
5. يضغط "حفظ"
6. إذا اكتملت جميع المراحل الإلزامية → "هل تريد تفعيل الموظف؟"

> **⚠️ تنبيه الفحص الطبي**: "غرامات عالية جداً على التأخير قد تُفلس الشركة" — يجب تنبيه عاجل خاص

## UC-11: تغيير حالة موظف

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-11 |
| **الفاعل الرئيسي** | مدير العمليات |

**السيناريو الرئيسي:**
1. يفتح صفحة الموظف → يختار "تغيير الحالة"
2. يختار الحالة الجديدة: فعّال / غير فعّال / إجازة
3. يُدخل **سبب التغيير** (إلزامي)
4. يضغط "حفظ"
5. النظام يُحدّث الحالة:
   - "غير فعّال" → **لا يظهر في كشف الرواتب**
   - "إجازة" → **لا يظهر في كشف الرواتب** لكن يبقى بالسجلات (مختلف عن غير فعّال — سيعود)

> **فترة التجربة**: 3 أشهر — "ممكن الموظف يمشي بعد شهر أو شهرين" → يتحول لـ "غير فعال"

---

## UC-12: إنشاء عقد جديد (مع القفل)

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-12 |
| **الفاعل الرئيسي** | صاحب العمل (المدير العام فقط) |
| **الشرط اللاحق** | العقد منشأ و**مقفل** — لا يمكن تعديله |

**السيناريو الرئيسي:**
1. يفتح "العقود" → "عقد جديد"
2. يختار العميل (يلا جو، كيتا، إلخ)
3. يُحدد نوع الحساب: بالطلب / راتب ثابت / مختلط
4. إذا بالطلب: يُدخل سعر الطلب (مثلاً 1.350 دينار)
5. يُدخل تاريخ البدء والانتهاء + شروط إضافية
6. يضغط **"حفظ وقفل"**
7. النظام يعرض: **"⚠️ بعد القفل لا يمكن تعديل بيانات العقد. هل أنت متأكد؟"**
8. يؤكد → النظام يحفظ بحالة "مقفل"

**السيناريوهات البديلة:**
- **7أ**: يلغي → يعود للتعديل قبل القفل
- **تعديل عقد مقفل**: فقط المدير العام + إدخال سبب → يُسجّل في Audit Log

> **⚠️ من الاجتماع**: "البيانات في العقد لا يمكن تغييرها بعد الإدخال لمنع التلاعب من مدير أو محاسب"

---

## UC-13: استخراج كشف الرواتب (رسمي + داخلي)

| البند | التفصيل |
|-------|---------|
| **الرمز** | UC-13 |
| **الفاعل الرئيسي** | المحاسب (أبو محمد) |
| **الشرط المسبق** | بيانات السجل اليومي مُدخلة للشهر |
| **الشرط اللاحق** | كشفان جاهزان للتصدير |

**السيناريو الرئيسي:**
1. المحاسب يفتح "كشوف الرواتب" → يختار الشهر
2. يضغط "حساب الرواتب"
3. النظام يحسب تلقائياً لكل موظف فعّال:
   - **ثابت**: الراتب كما هو
   - **بالطلب**: عدد الطلبات × سعر الطلب
   - **مختلط**: الأساسي + (الطلبات × السعر)
4. يُضيف: بونص طلبات + بونص توفير بترول + علاوات
5. يخصم: مخالفات + غرامات + صيانة (إن متسبب) + سلف
6. يعرض **كشفين**:
   - **رسمي** (للبنك): الراتب الأساسي فقط (المسجل بوزارة الشؤون)
   - **داخلي** (للداشبورد): أساسي + بونص + بدلات - خصومات = **صافي فعلي**
7. المحاسب يراجع ويصدّر (Excel/PDF)

**السيناريوهات البديلة:**
- **2أ**: بيانات ناقصة → تحذير "البيانات ناقصة لـ: [أسماء]"
- **7أ**: المحاسب يلاحظ خطأ → **لا يمكنه تعديل الرقم مباشرة** → يتواصل مع المدير العام

> **⚠️ من الاجتماع**: "المشكلة الحالية: أشخاص يغيرون أرقام الرواتب وقت الصرف" — لذلك الأرقام غير قابلة للتعديل

**السيناريو الرئيسي:**
1. المستخدم يسجّل دخول
2. النظام يعرض لوحة التحكم:
   - إجمالي السائقين الفعالين
   - حالة الأسطول: متاحة / تعمل / صيانة / واقفة
   - **الكاش المعلق الإجمالي** (الضغط → تفاصيل السائقين والسيارات)
   - المركبات بالصيانة (الضغط → تفاصيل)
   - تنبيهات: وثائق منتهية (🔴) + قريبة (🟡)
   - أفضل 5 سائقين أداءً
3. كل رقم **قابل للضغط** للانتقال لصفحة التفاصيل

> **من الاجتماع**: "صاحب البزنس يجب أن يتحكم بكل شيء ويعرف التدفقات المالية المتوقعة"

2. يضغط عليها
3. النظام يعرض مصنّفة:
   - 🔴 **أحمر**: منتهي/متأخر
   - 🟡 **أصفر**: قريب الانتهاء (قبل شهرين للوثائق / قبل أسبوع للصيانة)
   - 🟢 **أخضر**: ساري
4. الضغط على تنبيه → ينقل لصفحة العنصر (مركبة أو موظف)
5. يمكن تحديد "مقروء"

# ERPNext ↔ FleetOps MVP — خريطة الربط
# كيف يتكامل نظام FleetOps مع موديولات ERPNext

**التاريخ:** 2026-03-31  
**المرجع:** ERPNext Modules + FleetOps MVP Scope (07_MVP_Scope.md)

---

## نظرة عامة

FleetOps هو نظام متخصص بإدارة أساطيل التوصيل. ERPNext هو نظام ERP شامل.  
الهدف هو تحديد **أي موديولات ERPNext** يمكن استخدامها مباشرة، وأيها يحتاج تخصيص، وأيها يحتاج بناء من الصفر.

---

## 1. Accounting (المحاسبة) ← FleetOps Finance

| ERPNext Feature | FleetOps Equivalent | حالة الربط |
|----------------|---------------------|------------|
| Chart of Accounts | حسابات العقود + الموظفين + المركبات | ✅ يُستخدم مباشرة |
| General Ledger | سجل مدين/دائن للسائقين (HR-014) | ✅ يُستخدم مباشرة |
| Sales Invoice | فواتير العقود (دخل الطلبات) | ✅ يُستخدم مباشرة |
| Payment Entry | تسوية الكاش (OP-004) | ✅ يُستخدم مع تخصيص |
| ~~Budgeting~~ | ~~بودجت البنزين لكل مركبة~~ **(ملغى)** | ❌ غير مستخدم |
| Multi-currency | دينار كويتي كعملة أساسية | ✅ يُستخدم مباشرة |
| Financial Statements | تقارير الربحية (RP-005) | ✅ يُستخدم مباشرة |
| Journal Entry | قيود خصم المخالفات + الغرامات | ✅ يُستخدم مباشرة |

> **💡 الخلاصة:** موديول المحاسبة في ERPNext يغطي **90%** من احتياجاتنا المالية. فقط نحتاج تخصيص نموذج تسوية الكاش مع صورة الإيصال.

## التوصية النهائية

| الخيار | الوصف | الجهد |
|--------|-------|-------|
| **الخيار 1: ERPNext + Custom Apps** | استخدام ERPNext كأساس + بناء Custom Frappe Apps للميزات الخاصة | متوسط (3-4 أشهر) |
| **الخيار 2: بناء كامل من الصفر** | Laravel/React مع تصميم كل شيء يدوياً | عالي (6-8 أشهر) |
| **الخيار 3: ERPNext للمحاسبة فقط** | بناء FleetOps مستقل + ربط API مع ERPNext للمحاسبة والرواتب | متوسط-عالي (4-5 أشهر) |

> **🎯 الرؤية الاستراتيجية (توجيهات الإدارة):**
> بناءً على توجيهات العميل، تم اختيار ERPNext كخلفية مالية (Backend) بهدف **تقليل الأعباء البرمجية (Coding Burden)** وتجنب بناء نظام محاسبي معقد من الصفر. 
> يضمن النظام دقة محاسبية صارمة تفصل بوضوح بين:
> 1. **الموظفين الإداريين:** أصحاب الرواتب الثابتة.
> 2. **السائقين:** أصحاب الرواتب المتغيرة (المحسوبة بناءً على الطلبات اليومية والعقود).
> 
> **الخيار 3** — بناء FleetOps كنظام مستقل متخصص بعمليات الأسطول اليومية، وربط خلفيته مع ERPNext عبر API.

# خارطة الطريق ونموذج البيع المتعدد (SaaS & Milestones)

بناءً على التوجهات الاستراتيجية للعميل، لن يكون النظام حكراً على عمليات شركة واحدة، بل سيتم تصميمه وإعداده كمنتج برمجي (SaaS) قابل للتسويق والبيع لشركات توصيل أخرى.

---

## 1. خارطة الطريق والمراحل الزمنية (Milestones)
تم تحديد الإطار الزمني لتنفيذ وإطلاق المشروع الإجمالي بمدة **شهرين ونصف (2.5 Months)** مجدولة كالتالي:

| المرحلة | المدى الزمني | الوصف |
|---------|-------------|-------|
| **المرحلة الأولى (إدخال البيانات)** | بعد **شهر ونصف** | النظام يجب أن يكون جاهزاً تشغيلياً لتتمكن الشركة من بدء إدخال البيانات الميدانية للسائقين والعقود والإدارة اليومية. |
| **المرحلة الثانية (التسليم النهائي)** | بعد **شهر إضافي** | إطلاق كافة الميزات المتقدمة (AI، التكاملات المحاسبية النهائية) واختبار النظام لإعلانه جاهزاً للإطلاق الكامل بنهاية الشهرين والنصف. |

---

## 2. الذكاء الاصطناعي وأتمتة الواتساب (WhatsApp AI Integration)
بهدف تخفيف الضغط البشري الكبير على مدخلي البيانات (Operators)، سيتم دمج الذكاء الاصطناعي لاستقبال قراءات الطلبات اليومية المحققة من السائقين بأسلوب مؤتمت.

* **آلية العمل:** يقوم السائق بإرسال عدد الطلبات المنجزة عبر الواتساب للرقم المخصص للشركة. يقوم وكيل الذكاء الاصطناعي (AI Agent) بفهم الرسالة واستخلاص الرقم بدقة، ثم حقنه مباشرة في النظام لتسجيل إنجاز السائق دون تدخل بشري.
* **حدود الذكاء الاصطناعي:** سيكون مخصصاً وحصرياً لمعالجة وفهم **عدد الطلبات (Orders Count)** لضمان الدقة وتخفيف الضغط، ولن يتدخل في العمليات الإدارية الأخرى حالياً.

---

## 3. العزل وتعددية العملاء Multi-Tenant (SaaS Architecture)
بما أن النظام سيُقدم لعدة عملاء (شركات مختلفة)، يجب مراعاة العزل التام للخدمات والموارد لكل عميل جديد. وهذا يتطلب توثيقاً فنياً صارماً لكيفية تهيئة عميل جديد يتضمن:
* **عزل قنوات الواتساب (WhatsApp API Isolation):** يجب أن يمتلك كل عميل رقم هاتف منفصل، وحساب WhatsApp API خاص بشركته فقط (حسابات منفصلة تماماً).
* **عزل مفاتيح الذكاء الاصطناعي (AI API Isolation):** الاشتراك الخاص بواجهة الذكاء الاصطناعي يجب أن يكون مفصولاً بمفتاح API مخصص لكل عميل.
* **أدلة الاستضافة والتكاليف:** يجب تجهيز أدلة استضافة دقيقة (Deployment Instructions) توضح تكاليف إضافة عميل جديد، متطلبات السيرفرات الخاصة به، وتوليد واجهات الـ API المعزولة الخاصة بأتمتة شركته حصرياً.

        if(document.querySelector('.nav-link')) {
            const firstLink = document.querySelector('.nav-link');
            firstLink.classList.add('active');
            renderSection(firstLink.dataset.target);
            document.getElementById('current-doc-title').textContent = firstLink.dataset.title;
        }

        marked.setOptions({ gfm: true, breaks: true });
        
        function renderSection(id) {
            const sec = document.getElementById(id);
            if(sec && !sec.dataset.rendered) {
                const mdSource = sec.querySelector('.markdown-source');
                if(mdSource) {
                    let html = marked.parse(mdSource.textContent);
                    // Removed backdrop-blur-md from nested tables to prevent GPU layer explosion
                    html = html.replace(/<table>/g, '<div class="overflow-x-auto my-12 rounded-2xl bg-dark-bg/80 border border-white/5 shadow-xl"><table class="w-full text-sm text-right">');
                    html = html.replace(/<\/table>/g, '</table></div>');
                    html = html.replace(/<td>(عالية|High)<\/td>/g, '<td><span class="inline-flex gap-2 items-center px-3 py-1 bg-joybox-red/20 text-joybox-red rounded-lg font-bold border border-joybox-red/30 shadow-[0_0_10px_rgba(255,59,48,0.2)]"><span class="w-2 h-2 rounded-full bg-joybox-red animate-pulse"></span>عالية</span></td>');
                    html = html.replace(/<td>(متوسطة|Medium)<\/td>/g, '<td><span class="inline-flex gap-2 items-center px-3 py-1 bg-joybox-yellow/20 text-joybox-yellow rounded-lg font-bold border border-joybox-yellow/30 shadow-[0_0_10px_rgba(255,204,0,0.1)]"><span class="w-2 h-2 rounded-full bg-joybox-yellow"></span>متوسطة</span></td>');
                    html = html.replace(/<td>(منخفضة|Low)<\/td>/g, '<td><span class="inline-flex gap-2 items-center px-3 py-1 bg-slate-700/50 text-slate-300 rounded-lg font-bold border border-slate-600"><span class="w-2 h-2 rounded-full bg-slate-400"></span>منخفضة</span></td>');
                    html = html.replace(/JoyBox/g, '<span class="px-1 font-black text-transparent bg-clip-text bg-gradient-to-r from-joybox-blue via-joybox-red to-joybox-yellow text-lg tracking-wide drop-shadow-md">JoyBox</span>');
                    html = html.replace(/<h2>/g, '<h2 class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-joybox-blue/10 text-joybox-blue flex items-center justify-center border border-joybox-blue/20 shadow-[0_0_15px_rgba(65,105,225,0.2)]"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></span>');
                    sec.querySelector('.content-container').innerHTML = html;
                    sec.dataset.rendered = "true";
                }
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        function showSection(id, el) {
            renderSection(id);
            document.querySelectorAll('.section, .nav-link').forEach(e => e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            document.getElementById('current-doc-title').textContent = el.dataset.title;
            if(window.innerWidth < 768) closeSidebar();
            document.getElementById('scroller').scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
